  carInstancedMesh = new THREE.InstancedMesh(geo, mat, count);
  carInstancedMesh.userData.isCar = true;
  carInstancedMesh.frustumCulled = false;
  carInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  for (let i = 0; i < count; i++) {
    const segIdx = Math.floor(Math.random() * segs.length);
    const dir = Math.random() < 0.5 ? 1 : -1;
    const t = Math.random();
    _carColor.setHSL(Math.random(), 0.9, 0.55);
    carInstancedMesh.setColorAt(i, _carColor);
    const baseSpeed = CAR_SPEED * (0.85 + Math.random() * 0.3);
    carData.push({ idx: i, segIdx, dir, t, baseSpeed, currentSpeed: baseSpeed, lateralT: 0, _prevOncomingGap: Infinity });
  }
  if (carInstancedMesh.instanceColor) carInstancedMesh.instanceColor.needsUpdate = true;
  currentObj.add(carInstancedMesh);
  updateCars(0); // initial transform write — dt=0 so AI lerps are no-ops
}

function removeCars() {
  if (carInstancedMesh) {
    if (carInstancedMesh.parent) carInstancedMesh.parent.remove(carInstancedMesh);
    carInstancedMesh.geometry.dispose();
    carInstancedMesh.material.dispose();
    carInstancedMesh = null;
  }
  carData = [];
  _segBuckets.clear();
}

// Single-pass AI + transform write. Folds the old updateCars+updateCarPositions
// loops together so each car only does one segment lookup per frame.
function updateCars(dt) {
  if (!trafficData || !carInstancedMesh) return;
  const segs = trafficData.segments;
  const sw = trafficData.street_width;
  const followDist  = sw * FOLLOW_SW;
  const minGapDist  = sw * MIN_GAP_SW;
  const oncomingDist = sw * ONCOMING_SW;
  const clearDist   = sw * CLEAR_SW;
  // farthest distance at which any cross-segment neighbour still matters
  const maxScanDist = followDist > oncomingDist ? followDist : oncomingDist;
  const followRange = followDist - minGapDist;

  const surf = trafficData.surface || 'flat';
  const isFlat = surf === 'flat';
  const isSphere = surf === 'sphere' || surf === 'hemisphere';
  const lift = sw * 0.25;
  const laneOff = sw * 0.28;
  const lateralAmp = sw * 0.25;
  const torusMajor = isFlat || isSphere ? 0 : (trafficData.torus_major_sc || 0);
  const m = _carM4;
  const ela = m.elements;

  // bucket cars by segment (reuse arrays — no GC churn); skip tornado-captured cars
  for (const b of _segBuckets.values()) b.length = 0;
  for (let i = 0; i < carData.length; i++) {
    const car = carData[i];
    if (car.tornadoState) continue;
    let b = _segBuckets.get(car.segIdx);
    if (!b) { b = []; _segBuckets.set(car.segIdx, b); }
    b.push(car);
  }

  for (let i = 0; i < carData.length; i++) {
    const car = carData[i];
    if (car.tornadoState) continue; // tornado tick owns this car's matrix
    let seg = segs[car.segIdx];
    const isBlvd = seg.type === 'boulevard';
    const segLen = seg._len;

    let minFollowWorld   = Infinity;
    let minOncomingWorld = Infinity;

    // same-segment scan — skip if we're alone on this segment
    const bucket = _segBuckets.get(car.segIdx);
    if (bucket.length > 1) {
      const myFrac = car.dir === 1 ? car.t : 1 - car.t;
      for (let j = 0; j < bucket.length; j++) {
        const other = bucket[j];
        if (other === car) continue;
        if (other.dir === car.dir) {
          const gap = (other.t - car.t) * segLen;
          if (gap > 0 && gap < minFollowWorld) minFollowWorld = gap;
        } else if (!isBlvd) {
          const otFrac = other.dir === 1 ? other.t : 1 - other.t;
          const d = myFrac > otFrac ? myFrac - otFrac : otFrac - myFrac;
          const wg = d * segLen;
          if (wg < minOncomingWorld) minOncomingWorld = wg;
        }
      }
    }

    // cross-segment scan — only bother when we're close enough to the end
    // for a neighbour on the next segment to actually be in range.
    const myRemaining = (1 - car.t) * segLen;
    if (myRemaining < maxScanDist) {
      const frontKey = car.dir === 1 ? seg._ek : seg._sk;
      const adj = adjacency[frontKey];
      if (adj) {
        for (let k = 0; k < adj.length; k++) {
          const opt = adj[k];
          if (opt.segIdx === car.segIdx) continue;
          const nb = _segBuckets.get(opt.segIdx);
          if (!nb || !nb.length) continue;
          const nSeg = segs[opt.segIdx];
          const nSegLen = nSeg._len;
          const nIsBlvd = nSeg.type === 'boulevard';
          for (let j = 0; j < nb.length; j++) {
            const other = nb[j];
            if (other.dir === opt.dir) {
              const wg = myRemaining + other.t * nSegLen;
              if (wg < minFollowWorld) minFollowWorld = wg;
            } else if (!isBlvd && !nIsBlvd) {
              const wg = myRemaining + (1 - other.t) * nSegLen;
              if (wg < minOncomingWorld) minOncomingWorld = wg;
            }
          }
        }
      }
    }

    // speed: brake for car ahead, otherwise accelerate to baseSpeed
    const targetSpeed = minFollowWorld <= minGapDist ? car.baseSpeed * 0.5
      : minFollowWorld < followDist ? car.baseSpeed * (0.5 + 0.5 * (minFollowWorld - minGapDist) / followRange)
      : car.baseSpeed;
    const rate = targetSpeed < car.currentSpeed ? BRAKE_RATE : ACCEL_RATE;
    const sLerp = rate * dt; car.currentSpeed += (targetSpeed - car.currentSpeed) * (sLerp < 1 ? sLerp : 1);

    // lateral: shift right when an oncoming car is approaching (gap closing)
    const postPass = minOncomingWorld > car._prevOncomingGap;
    car._prevOncomingGap = minOncomingWorld;
    const clearThresh = postPass ? clearDist : oncomingDist;
    const lateralTarget = (!isBlvd && minOncomingWorld < clearThresh) ? 1 : 0;
    const lRate = lateralTarget > car.lateralT ? 2.5 : 3;
    const lLerp = lRate * dt; car.lateralT += (lateralTarget - car.lateralT) * (lLerp < 1 ? lLerp : 1);

    // advance along segment, hop to next segment if we ran off the end
    if (segLen > 0) car.t += (car.currentSpeed * dt) / segLen;
    if (car.t >= 1) {
      const next = nextSegment(car.segIdx, car.dir === 1);
      car.segIdx = next.segIdx; car.dir = next.dir; car.t = 0;
      seg = segs[car.segIdx];
    }

    // ── Render: write transform straight into the InstancedMesh buffer ──
    const s = car.dir === 1 ? seg.start : seg.end;
    const e = car.dir === 1 ? seg.end : seg.start;
    const ct = car.t;
    const x = s[0] + (e[0] - s[0]) * ct;
    const y = s[1] + (e[1] - s[1]) * ct;
    const z = s[2] + (e[2] - s[2]) * ct;
    const dx = e[0] - s[0], dy = e[1] - s[1], dz = e[2] - s[2];
    const lane = seg.type === 'boulevard' ? laneOff : car.lateralT * lateralAmp;

    if (!isFlat && (dx || dy || dz)) {
      if (isSphere) {
        _carNorm.set(x, y, z).normalize();
      } else {
        const xzl = Math.sqrt(x*x + z*z) || 1e-9;
        const k = torusMajor / xzl;
        _carNorm.set(x - x*k, y, z - z*k).normalize();
      }
      _carFwd.set(dx, dy, dz).normalize();
      _carRight.crossVectors(_carNorm, _carFwd).normalize();
      _carUp.crossVectors(_carFwd, _carRight);
      m.makeBasis(_carRight, _carUp, _carFwd);
      ela[12] = x + _carNorm.x * lift + _carRight.x * lane;
      ela[13] = y + _carNorm.y * lift + _carRight.y * lane;
      ela[14] = z + _carNorm.z * lift + _carRight.z * lane;
    } else {
      // flat: build rotation-Y matrix directly from (dx,dz) — no atan2/sin/cos
      const xzLen = Math.sqrt(dx*dx + dz*dz);
      const inv = xzLen > 0 ? 1 / xzLen : 0;
      const cs = dz * inv;  // cos(heading)
      const sn = dx * inv;  // sin(heading)
      ela[0] = cs;  ela[1] = 0; ela[2]  = -sn; ela[3]  = 0;
      ela[4] = 0;   ela[5] = 1; ela[6]  = 0;   ela[7]  = 0;
      ela[8] = sn;  ela[9] = 0; ela[10] = cs;  ela[11] = 0;
      ela[12] = x + lane * cs;
      ela[13] = y + lift;
      ela[14] = z - lane * sn;
      ela[15] = 1;
    }
    carInstancedMesh.setMatrixAt(car.idx, m);
  }
  carInstancedMesh.instanceMatrix.needsUpdate = true;
}

// ── Fire Event System ────────────────────────────────────────────────────────
const FIRE_SPAWN_INTERVAL = 600;
const FIRE_FIGHT_DURATION = 14;
const FIRE_EXTINGUISH_TIME = 8;
let _fireTimer = FIRE_SPAWN_INTERVAL;
let _fire = null;

function _hsl(h, s, l) {
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h*6)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<1/6){r=c;g=x;}else if(h<2/6){r=x;g=c;}else if(h<3/6){g=c;b=x;}
  else if(h<4/6){g=x;b=c;}else if(h<5/6){r=x;b=c;}else{r=c;b=x;}
  return[r+m,g+m,b+m];
}

function _spawnFireEvent() {
  if (!trafficData || !currentObj) return;
  const segs = trafficData.segments;
  if (!segs.length) return;
  const sw = trafficData.street_width;

  // Fire location: perpendicular offset from a random road segment into a building lot
  const fireSegIdx = Math.floor(Math.random() * segs.length);
  const seg = segs[fireSegIdx];
  const mx=(seg.start[0]+seg.end[0])/2, my=(seg.start[1]+seg.end[1])/2, mz=(seg.start[2]+seg.end[2])/2;
  const rdx=seg.end[0]-seg.start[0], rdz=seg.end[2]-seg.start[2];
  const rl=Math.hypot(rdx,rdz)||1e-6;
  const offDist=sw*(2.5+Math.random()*3), side=Math.random()<0.5?1:-1;
  const fx=mx+(-rdz/rl)*offDist*side, fz=mz+(rdx/rl)*offDist*side;

  // Probe actual building roof height at (fx, fz) via downward raycast
  let fy = my + sw * 2; // fallback: ~2 street-widths above road if no building hit
  currentObj.updateMatrixWorld(true);
  const testPt = new THREE.Vector3(fx, 0, fz);
  currentObj.localToWorld(testPt);
  const rc = new THREE.Raycaster(new THREE.Vector3(testPt.x, 9999, testPt.z), new THREE.Vector3(0,-1,0));
  const buildMeshes = [];
  currentObj.traverse(c => { if(c.isMesh && ['building','wall','window','roof'].includes(c.userData.colorKey)) buildMeshes.push(c); });
  const hits = rc.intersectObjects(buildMeshes, false);
  if (hits.length) {
    const localHit = currentObj.worldToLocal(hits[0].point.clone());
    fy = localHit.y + sw * 0.3;
  }

  const truckSegIdx = Math.floor(Math.random() * segs.length);

  const NF=250, NS=150, NW=180;

  // Fire particles
  const fp=new Float32Array(NF*3), fc=new Float32Array(NF*3);
  for(let i=0;i<NF;i++){
    fp[i*3]=(Math.random()-.5)*sw*.8; fp[i*3+1]=Math.random()*sw*2; fp[i*3+2]=(Math.random()-.5)*sw*.8;
    const[r,g,b]=_hsl(.03+Math.random()*.07,1,.45+Math.random()*.3);
    fc[i*3]=r; fc[i*3+1]=g; fc[i*3+2]=b;
  }
  const fGeo=new THREE.BufferGeometry();
  fGeo.setAttribute('position',new THREE.BufferAttribute(fp,3));
  fGeo.setAttribute('color',new THREE.BufferAttribute(fc,3));
  const firePts=new THREE.Points(fGeo,new THREE.PointsMaterial({size:.9,vertexColors:true,transparent:true,opacity:.95,depthWrite:false}));
  firePts.position.set(fx,fy,fz);

  // Smoke particles
  const sp=new Float32Array(NS*3);
  for(let i=0;i<NS;i++){
    sp[i*3]=(Math.random()-.5)*sw*1.5; sp[i*3+1]=Math.random()*sw*3; sp[i*3+2]=(Math.random()-.5)*sw*1.5;
  }
  const sGeo=new THREE.BufferGeometry();
  sGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
  const smokePts=new THREE.Points(sGeo,new THREE.PointsMaterial({color:0x445566,size:1.8,transparent:true,opacity:.15,depthWrite:false}));
  smokePts.position.set(fx,fy,fz);

  // Water particles (positions rebuilt each frame during fighting state)
  const wc=new Float32Array(NW*3);
  for(let i=0;i<NW;i++){wc[i*3]=.65+Math.random()*.35; wc[i*3+1]=.8+Math.random()*.2; wc[i*3+2]=1;}
  const wGeo=new THREE.BufferGeometry();
  wGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NW*3),3));
  wGeo.setAttribute('color',new THREE.BufferAttribute(wc,3));
  const waterPts=new THREE.Points(wGeo,new THREE.PointsMaterial({size:.55,vertexColors:true,transparent:true,opacity:0,depthWrite:false}));

  // Fire truck group (all positions in currentObj local / traffic coords)
  const tl=sw*1.8, tw=sw*.6, th=sw*.72;
  const truckGrp=new THREE.Group();
  truckGrp.add(new THREE.Mesh(new THREE.BoxGeometry(tw,th,tl),new THREE.MeshLambertMaterial({color:0xcc2222})));
  const cab=new THREE.Mesh(new THREE.BoxGeometry(tw*.85,th*.5,tl*.4),new THREE.MeshLambertMaterial({color:0xaa1111}));
  cab.position.set(0,th*.5+th*.25,tl*.28); truckGrp.add(cab);
  const lightBarMat=new THREE.MeshLambertMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:2});
  const lightBar=new THREE.Mesh(new THREE.BoxGeometry(tw*.7,th*.22,tl*.38),lightBarMat);
  lightBar.position.y=th*.5+th*.11; truckGrp.add(lightBar);
  truckGrp.matrixAutoUpdate = false;
  truckGrp.matrix.elements[13] = -9999;

  currentObj.add(firePts);
  currentObj.add(smokePts);
  currentObj.add(waterPts);
  currentObj.add(truckGrp);

  _fire={
    state:'responding', fx,fy,fz, fyRoad:my,
    firePts,smokePts,waterPts,truckGrp,lightBar,lightBarMat,
    lightTimer:0,lightPhase:0,
    fightTimer:0,extTimer:0,
    fireIntensity:1,smokeIntensity:1,
    segIdx:truckSegIdx,
    dir:Math.random()<.5?1:-1, t:Math.random(),
  };
}

function _fireSmartNext(curIdx, arrivedAtEnd, fx, fy, fz) {
  const seg=trafficData.segments[curIdx];
  const key=arrivedAtEnd?seg._ek:seg._sk;
  const opts=adjacency[key];
  if(!opts) return {segIdx:curIdx,dir:arrivedAtEnd?-1:1};
  const cands=opts.filter(o=>o.segIdx!==curIdx);
  if(!cands.length) return {segIdx:curIdx,dir:arrivedAtEnd?-1:1};
  let best=cands[0],bestD=Infinity;
  for(const opt of cands){
    const ns=trafficData.segments[opt.segIdx];
    const ep=opt.dir===1?ns.end:ns.start;
    const d=Math.hypot(ep[0]-fx, ep[1]-fy, ep[2]-fz);
    if(d<bestD){bestD=d;best=opt;}
  }
  return best;
}

function _removeFire() {
  if(!_fire) return;
  const f=_fire;
  for(const pts of[f.firePts,f.smokePts,f.waterPts]){
    if(pts.parent) pts.parent.remove(pts);
    pts.geometry.dispose(); pts.material.dispose();
  }
  if(f.truckGrp.parent) f.truckGrp.parent.remove(f.truckGrp);
  f.truckGrp.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});
  _fire=null;
  _fireTimer=FIRE_SPAWN_INTERVAL;
}

function _tickFire(dt) {
  if(!_fire){
    if(!trafficData||!currentObj) return;
    return;
  }
  const f=_fire;
  const sw=trafficData.street_width;

  // Strobe lights red/blue
  f.lightTimer+=dt;
  if(f.lightTimer>.22){
    f.lightTimer=0; f.lightPhase=(f.lightPhase+1)%4;
    const cols=[0xff2200,0x1133ff,0xff4400,0x0022ee];
    f.lightBarMat.color.setHex(cols[f.lightPhase]);
    f.lightBarMat.emissive.setHex(cols[f.lightPhase]);
  }

  // Animate fire particles: rise, flicker, reset when too high
  if(f.fireIntensity>0){
    const fi=f.fireIntensity, pa=f.firePts.geometry.attributes.position.array, n=pa.length/3;
    for(let i=0;i<n;i++){
      pa[i*3+1]+=(0.7+Math.random()*.9)*sw*1.6*dt*fi;
      pa[i*3]+=(Math.random()-.5)*sw*dt*fi*1.2;
      pa[i*3+2]+=(Math.random()-.5)*sw*dt*fi*1.2;
      if(pa[i*3+1]>sw*3.5*fi||Math.random()<.025){
        pa[i*3]=(Math.random()-.5)*sw*.8; pa[i*3+1]=0; pa[i*3+2]=(Math.random()-.5)*sw*.8;
      }
    }
    f.firePts.geometry.attributes.position.needsUpdate=true;
    f.firePts.material.opacity=.9*f.fireIntensity;
  }

  // Animate smoke: slower rise, horizontal drift
  if(f.smokeIntensity>0){
    const sa=f.smokePts.geometry.attributes.position.array, sn=sa.length/3;
    for(let i=0;i<sn;i++){
      sa[i*3+1]+=(0.3+Math.random()*.3)*sw*dt;
      sa[i*3]+=(Math.random()-.5)*sw*.5*dt;
      sa[i*3+2]+=(Math.random()-.5)*sw*.5*dt;
      if(sa[i*3+1]>sw*1||Math.random()<.008){
        sa[i*3]=(Math.random()-.5)*sw*1.5; sa[i*3+1]=0; sa[i*3+2]=(Math.random()-.5)*sw*1.5;
      }
    }
    f.smokePts.geometry.attributes.position.needsUpdate=true;
    f.smokePts.material.opacity=.15*f.smokeIntensity;
  }

  if(f.state==='responding'){
    // Drive truck toward fire using greedy road-graph navigation
    const segs=trafficData.segments;
    let seg=segs[f.segIdx];
    if(seg._len>0) f.t+=(CAR_SPEED*2.2*dt)/seg._len;
    if(f.t>=1){
      const next=_fireSmartNext(f.segIdx,f.dir===1,f.fx,f.fyRoad,f.fz);
      f.segIdx=next.segIdx; f.dir=next.dir; f.t=0;
      seg=segs[f.segIdx];
    }
    const s=f.dir===1?seg.start:seg.end, e=f.dir===1?seg.end:seg.start, ct=f.t;
    const tx=s[0]+(e[0]-s[0])*ct, tby=s[1]+(e[1]-s[1])*ct, tz=s[2]+(e[2]-s[2])*ct;
    const dx=e[0]-s[0], dy=e[1]-s[1], dz=e[2]-s[2];
    const lift=sw*.3, surf=trafficData.surface||'flat';
    const ela=f.truckGrp.matrix.elements;
    if(surf!=='flat'&&(dx||dy||dz)){
      let nx,ny,nz;
      if(surf==='sphere'||surf==='hemisphere'){
        const nl=Math.sqrt(tx*tx+tby*tby+tz*tz)||1e-9;
        nx=tx/nl; ny=tby/nl; nz=tz/nl;
      }else{
        const xzl=Math.sqrt(tx*tx+tz*tz)||1e-9, k=(trafficData.torus_major_sc||0)/xzl;
        const ux=tx*(1-k),uy=tby,uz=tz*(1-k),ul=Math.sqrt(ux*ux+uy*uy+uz*uz)||1e-9;
        nx=ux/ul; ny=uy/ul; nz=uz/ul;
      }
      const fl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-9, fx_=dx/fl,fy_=dy/fl,fz_=dz/fl;
      let rx=ny*fz_-nz*fy_, ry=nz*fx_-nx*fz_, rz=nx*fy_-ny*fx_;
      const rl=Math.sqrt(rx*rx+ry*ry+rz*rz)||1e-9; rx/=rl; ry/=rl; rz/=rl;
      const upx=fy_*rz-fz_*ry, upy=fz_*rx-fx_*rz, upz=fx_*ry-fy_*rx;
      ela[0]=rx;  ela[1]=ry;  ela[2]=rz;  ela[3]=0;
      ela[4]=upx; ela[5]=upy; ela[6]=upz; ela[7]=0;
      ela[8]=fx_; ela[9]=fy_; ela[10]=fz_;ela[11]=0;
      ela[12]=tx+nx*lift; ela[13]=tby+ny*lift; ela[14]=tz+nz*lift; ela[15]=1;
    }else{
      const xzl=Math.sqrt(dx*dx+dz*dz),inv=xzl>0?1/xzl:0;
      const cs=dz*inv, sn=dx*inv;
      ela[0]=cs; ela[1]=0; ela[2]=-sn; ela[3]=0;
      ela[4]=0;  ela[5]=1; ela[6]=0;   ela[7]=0;
      ela[8]=sn; ela[9]=0; ela[10]=cs; ela[11]=0;
      ela[12]=tx; ela[13]=tby+lift; ela[14]=tz; ela[15]=1;
    }
    f.truckGrp.matrixWorldNeedsUpdate=true;
    if(Math.hypot(tx-f.fx, tby-f.fyRoad, tz-f.fz)<sw*4){ f.state='fighting'; f.fightTimer=0; f.waterPts.material.opacity=.82; }

  }else if(f.state==='fighting'){
    f.fightTimer+=dt;
    // Water arc: parabolic spray from truck to fire
    const tela=f.truckGrp.matrix.elements;
    const tp={x:tela[12],y:tela[13],z:tela[14]};
    const wdx=f.fx-tp.x, wdz=f.fz-tp.z, wd=Math.hypot(wdx,wdz)||sw;
    const wpa=f.waterPts.geometry.attributes.position.array, wn=wpa.length/3;
    for(let i=0;i<wn;i++){
      const t=Math.random();
      wpa[i*3]  =tp.x+wdx*t+(Math.random()-.5)*sw*.25;
      wpa[i*3+1]=tp.y+(f.fy-tp.y)*t+Math.sin(t*Math.PI)*wd*.55+(Math.random()-.5)*sw*.15;
      wpa[i*3+2]=tp.z+wdz*t+(Math.random()-.5)*sw*.25;
    }
    f.waterPts.geometry.attributes.position.needsUpdate=true;
    f.fireIntensity=Math.max(0,1-f.fightTimer/FIRE_FIGHT_DURATION);
    if(f.fightTimer>=FIRE_FIGHT_DURATION){ f.state='extinguishing'; f.extTimer=0; f.waterPts.material.opacity=0; }

  }else if(f.state==='extinguishing'){
    f.extTimer+=dt;
    f.smokeIntensity=Math.max(0,1-f.extTimer/FIRE_EXTINGUISH_TIME);
    if(f.extTimer>FIRE_EXTINGUISH_TIME) _removeFire();
  }
}

// Surface normal + tangent frame helpers shared by tornado logic
function _torSurfNormal(x, y, z) {
  const surf = trafficData ? (trafficData.surface || 'flat') : 'flat';
  if (surf === 'sphere' || surf === 'hemisphere') {
    const l = Math.sqrt(x*x + y*y + z*z) || 1e-9;
    return [x/l, y/l, z/l];
  }
  if (surf === 'torus') {
    const xzl = Math.sqrt(x*x + z*z) || 1e-9;
    const k = (trafficData.torus_major_sc || 0) / xzl;
    const ux = x*(1-k), uy = y, uz = z*(1-k);
    const ul = Math.sqrt(ux*ux + uy*uy + uz*uz) || 1e-9;
    return [ux/ul, uy/ul, uz/ul];
  }
  return [0, 1, 0];
}
function _torTangentFrame(nx, ny, nz) {
  const ax = Math.abs(nx), ay = Math.abs(ny), az = Math.abs(nz);
  let hx, hy, hz;
  if (ax <= ay && ax <= az) { hx=1; hy=0; hz=0; }
  else if (ay <= az)        { hx=0; hy=1; hz=0; }
  else                      { hx=0; hy=0; hz=1; }
  let rx=hy*nz-hz*ny, ry=hz*nx-hx*nz, rz=hx*ny-hy*nx;
  const rl = Math.sqrt(rx*rx+ry*ry+rz*rz) || 1e-9;
  rx/=rl; ry/=rl; rz/=rl;
  return [rx, ry, rz, ny*rz-nz*ry, nz*rx-nx*rz, nx*ry-ny*rx]; // [right, forward]
}
function _torParticleColor(a, i) {
  const ci = i * 3;
  if (Math.random() < 0.22) {          // brown/grey highlight
    a[ci]   = 0.25 + Math.random() * 0.35;
    a[ci+1] = 0.18 + Math.random() * 0.26;
    a[ci+2] = 0.12 + Math.random() * 0.20;
  } else {                              // white / light grey
    const v = 0.70 + Math.random() * 0.30;
    a[ci]   = v;
    a[ci+1] = v * (0.90 + Math.random() * 0.10);
    a[ci+2] = v * (0.83 + Math.random() * 0.14);
  }
}
function _torProjectToSurface(tor) {
  const surf = trafficData ? (trafficData.surface || 'flat') : 'flat';
  if (surf === 'sphere' || surf === 'hemisphere') {
    const l = Math.sqrt(tor.x*tor.x + tor.y*tor.y + tor.z*tor.z) || 1e-9;
    tor.x = tor.x/l * tor.surfR;
    tor.y = tor.y/l * tor.surfR;
    tor.z = tor.z/l * tor.surfR;
  } else if (surf === 'torus') {
    const majorR = trafficData.torus_major_sc || 0;
    const xzl = Math.sqrt(tor.x*tor.x + tor.z*tor.z) || 1e-9;
    const ringX = tor.x/xzl * majorR, ringZ = tor.z/xzl * majorR;
    const offX = tor.x - ringX, offY = tor.y, offZ = tor.z - ringZ;
    const offL = Math.sqrt(offX*offX + offY*offY + offZ*offZ) || 1e-9;
    tor.x = ringX + offX/offL * tor.minorR;
    tor.y =         offY/offL * tor.minorR;
    tor.z = ringZ + offZ/offL * tor.minorR;
  }
}

// ── Tornado Event System ──────────────────────────────────────────────────────
const TORNADO_SPAWN_INTERVAL = 600;
let _tornadoTimer = TORNADO_SPAWN_INTERVAL;
let _tornado = null;

function _spawnTornadoEvent() {
  if (!trafficData || !currentObj || !carInstancedMesh) return;
  const segs = trafficData.segments;
  if (!segs.length) return;
  const sw = trafficData.street_width;

  // Spawn at a random road midpoint
  const seg = segs[Math.floor(Math.random() * segs.length)];
  const ox = (seg.start[0] + seg.end[0]) / 2;
  const oy = (seg.start[1] + seg.end[1]) / 2;
  const oz = (seg.start[2] + seg.end[2]) / 2;

  const baseR  = sw * 2.0; // eye radius at ground
  const topR   = sw * 3.4; // radius at top — tight angle, barely wider
  const coneH  = sw * 28;  // visual height of funnel

  // Drift slowly in a random direction
  const driftAngle = Math.random() * Math.PI * 2;
  const driftSpeed = sw * 1.2;

  // Particle funnel: wide at top, tight at bottom (inverted cone)
  const NP = 1400;
  const pPos = new Float32Array(NP * 3);
  const pCol = new Float32Array(NP * 3);
  const pAngles  = new Float32Array(NP);
  const pHeights = new Float32Array(NP);
  const pRadii   = new Float32Array(NP); // 0-1 radial scale per particle

  for (let i = 0; i < NP; i++) {
    pHeights[i] = Math.random() * coneH;
    pAngles[i]  = Math.random() * Math.PI * 2;
    pRadii[i]   = 0.84 + Math.random() * 0.16; // ring near outer edge — eye is hollow
    _torParticleColor(pCol, i);
  }

  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
  const pts = new THREE.Points(pGeo,
    new THREE.PointsMaterial({ size: 0.8, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false })
  );
  currentObj.add(pts);

  // Surface-tracking constants computed at spawn position
  const surfR = Math.sqrt(ox*ox + oy*oy + oz*oz); // sphere radius
  let minorR = 0; // torus tube radius
  if (trafficData.surface === 'torus') {
    const majorR = trafficData.torus_major_sc || 0;
    const xzl0 = Math.sqrt(ox*ox + oz*oz) || 1e-9;
    const rX = ox/xzl0*majorR, rZ = oz/xzl0*majorR;
    minorR = Math.sqrt((ox-rX)*(ox-rX) + oy*oy + (oz-rZ)*(oz-rZ));
  }

  _tornado = {
    state: 'active',
    x: ox, y: oy, z: oz,
    driftX: Math.cos(driftAngle) * driftSpeed,
    driftZ: Math.sin(driftAngle) * driftSpeed,
    baseR, topR, coneH, sw, surfR, minorR,
    pts, pAngles, pHeights, pRadii, NP,
    capturedCars: [],
    timer: 0, activeDur: 20, dissipatingDur: 4,
    spinAngle: 0,
  };
}

function _removeTornado() {
  if (!_tornado) return;
  const tor = _tornado;
  // Return captured cars to road at a random segment
  for (const cc of tor.capturedCars) {
    const car = carData[cc];
    if (!car) continue;
    car.tornadoState = null;
    const segs = trafficData ? trafficData.segments : [];
    if (segs.length) {
      car.segIdx = Math.floor(Math.random() * segs.length);
      car.dir = Math.random() < 0.5 ? 1 : -1;
      car.t = Math.random();
    }
    car.currentSpeed = 0;
  }
  if (tor.pts.parent) tor.pts.parent.remove(tor.pts);
  tor.pts.geometry.dispose(); tor.pts.material.dispose();
  _tornado = null;
  _tornadoTimer = TORNADO_SPAWN_INTERVAL;
}

function _tickTornado(dt) {
  if (!_tornado) {
    if (!trafficData || !currentObj || !carInstancedMesh) return;
    return;
  }
  const tor = _tornado;
  const sw = tor.sw;
  tor.timer += dt;
  tor.spinAngle += dt * 1.8;

  let intensity = 1;
  if (tor.state === 'active') {
    // Drift along the surface tangent plane, then snap back to surface
    const [ndx, ndy, ndz] = _torSurfNormal(tor.x, tor.y, tor.z);
    const [rdx, rdy, rdz, fdx, fdy, fdz] = _torTangentFrame(ndx, ndy, ndz);
    tor.x += (rdx * tor.driftX + fdx * tor.driftZ) * dt;
    tor.y += (rdy * tor.driftX + fdy * tor.driftZ) * dt;
    tor.z += (rdz * tor.driftX + fdz * tor.driftZ) * dt;
    _torProjectToSurface(tor);
    if (tor.timer >= tor.activeDur) { tor.state = 'dissipating'; tor.timer = 0; }
  } else {
    intensity = Math.max(0, 1 - tor.timer / tor.dissipatingDur);
    tor.pts.material.opacity = 0.85 * intensity;
    if (tor.timer >= tor.dissipatingDur) { _removeTornado(); return; }
  }

  // Surface frame at tornado centre (recomputed each frame as it drifts)
  const [nx, ny, nz] = _torSurfNormal(tor.x, tor.y, tor.z);
  const [rx, ry, rz, fx_, fy_, fz_] = _torTangentFrame(nx, ny, nz);

  // Animate funnel particles: rise along surface normal, ring in tangent plane
  const ppa = tor.pts.geometry.attributes.position.array;
  const cpa = tor.pts.geometry.attributes.color.array;
  const riseSpeed = sw * 7;
  for (let i = 0; i < tor.NP; i++) {
    tor.pHeights[i] += dt * riseSpeed;
    if (tor.pHeights[i] > tor.coneH * intensity) {
      tor.pHeights[i] = 0;
      tor.pAngles[i] = Math.random() * Math.PI * 2;
      _torParticleColor(cpa, i);
    }
    const h = tor.pHeights[i];
    const frac = h / tor.coneH;
    const coneR = tor.baseR + frac * (tor.topR - tor.baseR);
    const r = coneR * tor.pRadii[i] * intensity;
    const spinRate = 2.5 - frac * 1.5;
    tor.pAngles[i] += dt * spinRate;
    const ca = Math.cos(tor.pAngles[i]), sa = Math.sin(tor.pAngles[i]);
    ppa[i*3]   = tor.x + rx*ca*r + fx_*sa*r + nx*h;
    ppa[i*3+1] = tor.y + ry*ca*r + fy_*sa*r + ny*h;
    ppa[i*3+2] = tor.z + rz*ca*r + fz_*sa*r + nz*h;
  }
  tor.pts.geometry.attributes.position.needsUpdate = true;
  tor.pts.geometry.attributes.color.needsUpdate = true;

  if (!carInstancedMesh) return;

  // Capture nearby cars
  if (tor.state === 'active') {
    const captureR = tor.sw * 10.0;
    const captureRSq = captureR * captureR;
    for (let i = 0; i < carData.length; i++) {
      const car = carData[i];
      if (car.tornadoState) continue;
      const seg = trafficData.segments[car.segIdx];
      const s = car.dir === 1 ? seg.start : seg.end;
      const e = car.dir === 1 ? seg.end   : seg.start;
      const cx = s[0] + (e[0]-s[0]) * car.t;
      const cz = s[2] + (e[2]-s[2]) * car.t;
      const cy = s[1] + (e[1]-s[1]) * car.t + sw * 0.25;
      const dx = cx - tor.x, dy = cy - tor.y, dz = cz - tor.z;
      if (dx*dx + dy*dy + dz*dz < captureRSq) {
        // Project offset onto tangent plane for orbit angle/radius
        const dr = dx*rx + dy*ry + dz*rz;
        const df = dx*fx_ + dy*fy_ + dz*fz_;
        car.tornadoState = {
          px: cx, py: cy, pz: cz,
          angle: Math.atan2(df, dr),
          radius: Math.sqrt(dr*dr + df*df),
          ht: 0,
          angularV: 1.5 + Math.random() * 1.5,
          jx: 0, jz: 0,           // smoothed jitter offset
          tjx: 0, tjz: 0,         // jitter target
          jTimer: 0,
        };
        tor.capturedCars.push(i);
      }
    }
  }

  // Tick each captured car with vortex physics, write its matrix directly
  const ela = _torM4.elements;
  for (const ci of tor.capturedCars) {
    const car = carData[ci];
    if (!car || !car.tornadoState) continue;
    const ts = car.tornadoState;

    // Spiral inward and upward, spin accelerating
    ts.ht         += dt * sw * 7;
    ts.angle      += ts.angularV * dt;
    ts.radius      = Math.max(sw * 0.5, ts.radius * (1 - dt * 0.35));
    ts.angularV    = Math.min(8, ts.angularV + dt * 0.8);

    // Smoothed turbulence: pick a new target offset every ~0.5s, lerp toward it
    ts.jTimer -= dt;
    if (ts.jTimer <= 0) {
      ts.tjx = (Math.random() - 0.5) * sw * 0.5;
      ts.tjz = (Math.random() - 0.5) * sw * 0.5;
      ts.jTimer = 0.4 + Math.random() * 0.3;
    }
    ts.jx += (ts.tjx - ts.jx) * Math.min(1, dt * 4);
    ts.jz += (ts.tjz - ts.jz) * Math.min(1, dt * 4);
    // Orbit in tangent plane, lift along surface normal, jitter in tangent plane
    const ca = Math.cos(ts.angle), sa = Math.sin(ts.angle);
    const px = tor.x + (rx*ca + fx_*sa)*ts.radius + nx*ts.ht + rx*ts.jx + fx_*ts.jz;
    const py = tor.y + (ry*ca + fy_*sa)*ts.radius + ny*ts.ht + ry*ts.jx + fy_*ts.jz;
    const pz = tor.z + (rz*ca + fz_*sa)*ts.radius + nz*ts.ht + rz*ts.jx + fz_*ts.jz;

    // Car orientation: surface normal as up, orbit tangent as forward
    const tdx = -sa*rx + ca*fx_, tdy = -sa*ry + ca*fy_, tdz = -sa*rz + ca*fz_;
    let crx = ny*tdz-nz*tdy, cry = nz*tdx-nx*tdz, crz = nx*tdy-ny*tdx;
    const crl = Math.sqrt(crx*crx+cry*cry+crz*crz) || 1e-9;
    crx/=crl; cry/=crl; crz/=crl;
    ela[0]=crx; ela[1]=cry; ela[2]=crz; ela[3]=0;
    ela[4]=nx;  ela[5]=ny;  ela[6]=nz;  ela[7]=0;
    ela[8]=tdx; ela[9]=tdy; ela[10]=tdz;ela[11]=0;
    ela[12]=px; ela[13]=py; ela[14]=pz; ela[15]=1;
    carInstancedMesh.setMatrixAt(car.idx, _torM4);
  }
  if (tor.capturedCars.length) carInstancedMesh.instanceMatrix.needsUpdate = true;
}

// ── UFO Abduction Event System ────────────────────────────────────────────────
const UFO_SPAWN_INTERVAL = 600;
let _ufoTimer = UFO_SPAWN_INTERVAL;
let _ufo = null;

// ── Boid bird flock ───────────────────────────────────────────────────────────
let _birds = null;

function _spawnBirds() {
  if (!trafficData) return;
  const sw = trafficData.street_width;

  let maxX = 0, maxZ = 0;
  for (const seg of trafficData.segments) {
    maxX = Math.max(maxX, Math.abs(seg.start[0]), Math.abs(seg.end[0]));
    maxZ = Math.max(maxZ, Math.abs(seg.start[2]), Math.abs(seg.end[2]));
  }
  const halfW = maxX || sw * 25, halfD = maxZ || sw * 25;
  const flightH    = sw * 500;
  const spd        = sw * 90;
  const SEP_R      = sw * 150;
  const NEIGHBOR_R = sw * 600;

  const NC = 500, NB = 6000;
  const spread = sw * 100;

  // two shared flock-level wander targets — tune these to control spread
  const _wStep   = sw * 500;
  const _wanderX = halfW * 4;   // ± X range for both targets
  const _wanderY = flightH * 2; // Y jitter around flightH
  const _wanderZ = halfD * 4;    // ± Z range for both targets
  function _randTargetA(b) {
    b.wax = Math.max(-_wanderX, Math.min(_wanderX, b.wax + (Math.random()-0.5)*2*_wStep));
    b.way = Math.max(flightH, flightH + (Math.random()-0.3)*_wanderY);
    b.waz = Math.max(-_wanderZ, Math.min(_wanderZ, b.waz + (Math.random()-0.5)*2*_wStep));
    b.waTimer = 16 + Math.random() * 10;
  }
  function _randTargetB(b) {
    b.wbx = Math.max(-_wanderX, Math.min(_wanderX, b.wbx + (Math.random()-0.5)*2*_wStep));
    b.wby = Math.max(flightH, flightH + (Math.random()-0.3)*_wanderY);
    b.wbz = Math.max(-_wanderZ, Math.min(_wanderZ, b.wbz + (Math.random()-0.5)*2*_wStep));
    b.wbTimer = 16 + Math.random() * 10;
  }
  function _randTargetC(b) {
    b.wcx = Math.max(-_wanderX, Math.min(_wanderX, b.wcx + (Math.random()-0.5)*2*_wStep));
    b.wcy = Math.max(flightH, flightH + (Math.random()-0.3)*_wanderY);
    b.wcz = Math.max(-_wanderZ, Math.min(_wanderZ, b.wcz + (Math.random()-0.5)*2*_wStep));
    b.wcTimer = 16 + Math.random() * 10;
  }

  const centers = [];
  for (let i = 0; i < NC; i++) {
    const ha = Math.random() * Math.PI * 2;
    centers.push({
      x: (Math.random() - 0.5) * halfW * 1.4,
      y: flightH + Math.random() * flightH * 0.2,
      z: (Math.random() - 0.5) * halfD * 1.4,
      hx: Math.cos(ha), hy: 0, hz: Math.sin(ha),
      neighbors: [],
    });
  }

  // Per-bird offsets
  const assign   = new Int32Array(NB);
  const offX     = new Float32Array(NB);
  const offY     = new Float32Array(NB);
  const offZ     = new Float32Array(NB);
  const tgtOX    = new Float32Array(NB);
  const tgtOY    = new Float32Array(NB);
  const tgtOZ    = new Float32Array(NB);
  const offTimer = new Float32Array(NB);
  for (let i = 0; i < NB; i++) {
    assign[i]   = i % NC;
    tgtOX[i]    = (Math.random() - 0.5) * spread * 0.1;
    tgtOY[i]    = (Math.random() - 0.5) * spread * 0.1;
    tgtOZ[i]    = (Math.random() - 0.5) * spread * 0.1;
    offTimer[i] = Math.random() * 2;
  }

  const geo = new THREE.BufferGeometry();
  const pa  = new Float32Array(NB * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pa, 3));
  const mat = new THREE.PointsMaterial({ color: 0x111111, size: 0.1, sizeAttenuation: true });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);

  _birds = { centers, pts, pa, assign, offX, offY, offZ, tgtOX, tgtOY, tgtOZ, offTimer,
             wax: 0, way: 0, waz: 0, waTimer: 0,
             wbx: 0, wby: 0, wbz: 0, wbTimer: 0,
             wcx: 0, wcy: 0, wcz: 0, wcTimer: 0,
             NC, NB, sw, halfW, halfD, flightH, spd, SEP_R, NEIGHBOR_R, spread,
             _randTargetA, _randTargetB, _randTargetC, neighborTimer: 0 };
  _randTargetA(_birds);
  _randTargetB(_birds);
  _birds.wbTimer += 2 + Math.random() * 3;
  _randTargetC(_birds);
  _birds.wcTimer += 4 + Math.random() * 3;
}

function _tickBirds(dt) {
  if (!_birds) return;
  const b = _birds;
  const { centers, NC, NB, spd, SEP_R, NEIGHBOR_R, spread } = b;
  const TURN = dt * 2.2;

  // ── Refresh shared wander targets ────────────────────────────────────────
  b.waTimer -= dt; if (b.waTimer <= 0) b._randTargetA(b);
  b.wbTimer -= dt; if (b.wbTimer <= 0) b._randTargetB(b);
  b.wcTimer -= dt; if (b.wcTimer <= 0) b._randTargetC(b);

  // ── Rebuild neighbour lists periodically via spatial grid (XZ) ────────────
  b.neighborTimer -= dt;
  if (b.neighborTimer <= 0) {
    b.neighborTimer = 0.3;
    const cellSize = NEIGHBOR_R;
    const grid = new Map();
    for (let i = 0; i < NC; i++) {
      const c = centers[i];
      const key = `${Math.floor(c.x / cellSize)},${Math.floor(c.z / cellSize)}`;
      let cell = grid.get(key);
      if (!cell) { cell = []; grid.set(key, cell); }
      cell.push(i);
    }
    const NR2 = NEIGHBOR_R * NEIGHBOR_R;
    for (let i = 0; i < NC; i++) {
      const c = centers[i];
      const gx = Math.floor(c.x / cellSize);
      const gz = Math.floor(c.z / cellSize);
      const nbrs = [];
      for (let ox = -1; ox <= 1; ox++) {
        for (let oz = -1; oz <= 1; oz++) {
          const cell = grid.get(`${gx+ox},${gz+oz}`);
          if (!cell) continue;
          for (const j of cell) {
            if (j === i) continue;
            const sx = c.x - centers[j].x, sz = c.z - centers[j].z;
            if (sx*sx + sz*sz < NR2) nbrs.push(j);
          }
        }
      }
      c.neighbors = nbrs;
    }
  }

  for (let i = 0; i < NC; i++) {
    const c = centers[i];

    // each center picks whichever shared target is closest in XZ
    const da2 = (b.wax-c.x)**2 + (b.waz-c.z)**2;
    const db2 = (b.wbx-c.x)**2 + (b.wbz-c.z)**2;
    const dc2 = (b.wcx-c.x)**2 + (b.wcz-c.z)**2;
    const wx = da2 <= db2 && da2 <= dc2 ? b.wax : db2 <= dc2 ? b.wbx : b.wcx;
    const wy = da2 <= db2 && da2 <= dc2 ? b.way : db2 <= dc2 ? b.wby : b.wcy;
    const wz = da2 <= db2 && da2 <= dc2 ? b.waz : db2 <= dc2 ? b.wbz : b.wcz;

    const nbrs = c.neighbors;
    let dx = 0, dy = 0, dz = 0;

    if (nbrs.length > 0) {
      // local centre of mass (cohesion)
      let lcx = 0, lcy = 0, lcz = 0;
      // average heading (alignment)
      let lhx = 0, lhy = 0, lhz = 0;
      // separation push
      let sepX = 0, sepY = 0, sepZ = 0;

      for (let k = 0; k < nbrs.length; k++) {
        const n = centers[nbrs[k]];
        lcx += n.x; lcy += n.y; lcz += n.z;
        lhx += n.hx; lhy += n.hy; lhz += n.hz;
        const sx = c.x - n.x, sy = c.y - n.y, sz = c.z - n.z;
        const d = Math.hypot(sx, sy, sz);
        if (d < SEP_R && d > 0) {
          sepX += (sx / d) * (SEP_R - d) * 3;
          sepY += (sy / d) * (SEP_R - d) * 3;
          sepZ += (sz / d) * (SEP_R - d) * 3;
        }
      }
      const cnt = nbrs.length;
      lcx /= cnt; lcy /= cnt; lcz /= cnt;

      const cohX = lcx - c.x, cohY = lcy - c.y, cohZ = lcz - c.z;
      const cohL = Math.hypot(cohX, cohY, cohZ) || 1;

      const alL = Math.hypot(lhx, lhy, lhz) || 1;
      lhx /= alL; lhy /= alL; lhz /= alL;

      dx = cohX/cohL * 0.4 + lhx * 0.4 + sepX + (wx - c.x) * 0.1;
      dy = cohY/cohL * 0.4 + lhy * 0.4 + sepY * 0.05 + (wy - c.y) * 0.1;
      dz = cohZ/cohL * 0.4 + lhz * 0.4 + sepZ + (wz - c.z) * 0.1;
    } else {
      dx = wx - c.x;
      dy = wy - c.y;
      dz = wz - c.z;
    }

    const dl = Math.hypot(dx, dy, dz) || 1e-9;
    const nx = dx/dl, ny = dy/dl, nz = dz/dl;
    c.hx += (nx - c.hx) * TURN;
    c.hy += (ny - c.hy) * TURN;
    c.hz += (nz - c.hz) * TURN;
    const hl = Math.hypot(c.hx, c.hy, c.hz) || 1e-9;
    c.hx /= hl; c.hy /= hl; c.hz /= hl;

    c.x += c.hx * spd * dt;
    c.y += c.hy * spd * dt;
    c.z += c.hz * spd * dt;
  }

  // ── Update bird particles ─────────────────────────────────────────────────
  const pa = b.pa;
  for (let i = 0; i < NB; i++) {
    b.offTimer[i] -= dt;
    if (b.offTimer[i] <= 0) {
      b.tgtOX[i] = (Math.random() - 0.5) * spread;
      b.tgtOY[i] = (Math.random() - 0.5) * spread * 0.35;
      b.tgtOZ[i] = (Math.random() - 0.5) * spread;
      b.offTimer[i] = 0.8 + Math.random() * 1.4;
    }
    const lr = Math.min(1, dt * 2.5);
    b.offX[i] += (b.tgtOX[i] - b.offX[i]) * lr;
    b.offY[i] += (b.tgtOY[i] - b.offY[i]) * lr;
    b.offZ[i] += (b.tgtOZ[i] - b.offZ[i]) * lr;

    const c = centers[b.assign[i]];
    pa[i*3]   = c.x + b.offX[i];
    pa[i*3+1] = c.y + b.offY[i];
    pa[i*3+2] = c.z + b.offZ[i];
  }
  b.pts.geometry.attributes.position.needsUpdate = true;

}

function _despawnBirds() {
  if (!_birds) return;
  scene.remove(_birds.pts);
  _birds.pts.geometry.dispose();
  _birds.pts.material.dispose();
  _birds = null;
  document.getElementById('btn-birds').classList.remove('active');
}

function _spawnUfoEvent() {
  if (!trafficData || !currentObj) return;
  const segs = trafficData.segments;
  if (!segs.length) return;
  const sw = trafficData.street_width;

  // Pick a random road point for the victim car
  const segIdx = Math.floor(Math.random() * segs.length);
  const seg = segs[segIdx];
  const tp = 0.3 + Math.random() * 0.4;
  const cx = seg.start[0] + (seg.end[0] - seg.start[0]) * tp;
  const cy = seg.start[1] + (seg.end[1] - seg.start[1]) * tp;
  const cz = seg.start[2] + (seg.end[2] - seg.start[2]) * tp;
  const cdx = seg.end[0] - seg.start[0], cdz = seg.end[2] - seg.start[2];
  const carLift = sw * 0.25;

  // Surface normal + tangent frame at car position
  const [nx, ny, nz] = _torSurfNormal(cx, cy, cz);
  const [rx, ry, rz, fwx, fwy, fwz] = _torTangentFrame(nx, ny, nz);
  const carX = cx + nx*carLift, carY = cy + ny*carLift, carZ = cz + nz*carLift;

  // Victim car — placed at surface-normal-lifted position
  const carMesh = new THREE.Mesh(
    new THREE.BoxGeometry(sw * 0.4, sw * 0.5, sw * 1.2),
    new THREE.MeshLambertMaterial({ color: 0x00ff88 })
  );
  carMesh.rotation.y = Math.atan2(cdx, cdz);
  carMesh.position.set(carX, carY, carZ);
  currentObj.add(carMesh);

  // UFO disc + dome + ring lights
  const ufoR = sw * 4.8;
  const ufoGrp = new THREE.Group();
  ufoGrp.matrixAutoUpdate = false;

  const discMesh = new THREE.Mesh(
    new THREE.SphereGeometry(ufoR, 28, 14),
    new THREE.MeshLambertMaterial({ color: 0xb0b8cc })
  );
  discMesh.scale.y = 0.22;
  ufoGrp.add(discMesh);

  const domeMesh = new THREE.Mesh(
    new THREE.SphereGeometry(ufoR * 0.42, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x99ddff, transparent: true, opacity: 0.65 })
  );
  domeMesh.position.y = ufoR * 0.22;
  ufoGrp.add(domeMesh);

  const nLights = 12;
  const lightMats = [];
  for (let i = 0; i < nLights; i++) {
    const a = (i / nLights) * Math.PI * 2;
    const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    lightMats.push(mat);
    const lm = new THREE.Mesh(new THREE.SphereGeometry(ufoR * 0.08, 6, 4), mat);
    lm.position.set(Math.cos(a) * ufoR * 0.82, 0, Math.sin(a) * ufoR * 0.82);
    ufoGrp.add(lm);
  }

  const beamLight = new THREE.PointLight(0x88ffcc, 0, sw * 35);
  beamLight.position.y = -ufoR * 0.4;
  ufoGrp.add(beamLight);

  // Hover target: above car along surface normal
  const hoverH = sw * 22;
  const targetX = cx + nx*hoverH, targetY = cy + ny*hoverH, targetZ = cz + nz*hoverH;

  // Off-screen start: tangent-plane direction + normal height offset
  const arrivalAngle = Math.random() * Math.PI * 2;
  const offDist = sw * 180;
  const arTX = Math.cos(arrivalAngle)*rx + Math.sin(arrivalAngle)*fwx;
  const arTY = Math.cos(arrivalAngle)*ry + Math.sin(arrivalAngle)*fwy;
  const arTZ = Math.cos(arrivalAngle)*rz + Math.sin(arrivalAngle)*fwz;
  const startX = targetX + arTX*offDist + nx*hoverH*1.5;
  const startY = targetY + arTY*offDist + ny*hoverH*1.5;
  const startZ = targetZ + arTZ*offDist + nz*hoverH*1.5;

  // Departure: different tangent direction, higher along normal
  const departAngle = arrivalAngle + Math.PI * (0.4 + Math.random() * 0.6);
  const depTX = Math.cos(departAngle)*rx + Math.sin(departAngle)*fwx;
  const depTY = Math.cos(departAngle)*ry + Math.sin(departAngle)*fwy;
  const depTZ = Math.cos(departAngle)*rz + Math.sin(departAngle)*fwz;
  const departX = targetX + depTX*offDist + nx*hoverH*3.0;
  const departY = targetY + depTY*offDist + ny*hoverH*3.0;
  const departZ = targetZ + depTZ*offDist + nz*hoverH*3.0;

  // Pick random planet mesh references for origin/destination
  const _pickPlanetMesh = () => _solarPlanets.length
    ? _solarPlanets[Math.floor(Math.random() * _solarPlanets.length)].mesh
    : null;
  const fromPlanetMesh = _pickPlanetMesh();
  const toPlanetMesh   = _pickPlanetMesh();
  const fromPlanet = fromPlanetMesh ? currentObj.worldToLocal(fromPlanetMesh.position.clone()) : null;

  // Initialise UFO at planet origin (or start) with correct surface orientation
  const initX = fromPlanet ? fromPlanet.x : startX;
  const initY = fromPlanet ? fromPlanet.y : startY;
  const initZ = fromPlanet ? fromPlanet.z : startZ;
  const ela = ufoGrp.matrix.elements;
  ela[0]=rx; ela[1]=ry; ela[2]=rz; ela[3]=0;
  ela[4]=nx; ela[5]=ny; ela[6]=nz; ela[7]=0;
  ela[8]=fwx;ela[9]=fwy;ela[10]=fwz;ela[11]=0;
  ela[12]=initX;ela[13]=initY;ela[14]=initZ;ela[15]=1;
  currentObj.add(ufoGrp);

  // Tractor beam particles
  const NB = 480;
  const beamGeo = new THREE.BufferGeometry();
  beamGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NB * 3), 3));
  const beamPts = new THREE.Points(beamGeo,
    new THREE.PointsMaterial({ color: 0x88ffcc, size: 0.2, transparent: true, opacity: 0, depthWrite: false })
  );
  currentObj.add(beamPts);

  _ufo = {
    state: fromPlanet ? 'from_planet' : 'incoming',
    carMesh, cx: carX, cy: carY, cz: carZ,
    ufoGrp, beamPts, beamLight, lightMats, nLights,
    nx, ny, nz, rx, ry, rz, fwx, fwy, fwz,
    targetX, targetY, targetZ,
    startX, startY, startZ, hoverH, sw, ufoR,
    timer: 0, spinAngle: 0,
    incomingDur: 10.5, hoverDur: 3.6, liftDur: 9.6, absorbDur: 1.8, departDur: 7.5,
    fromPlanetX: fromPlanet ? fromPlanet.x : startX,
    fromPlanetY: fromPlanet ? fromPlanet.y : startY,
    fromPlanetZ: fromPlanet ? fromPlanet.z : startZ,
    fromPlanetDur: 13.0,
    toPlanetMesh,
    toPlanetDur: 13.0,
    departX, departY, departZ,
    lightTimer: 0, lightIdx: 0,
    departFromX: 0, departFromY: 0, departFromZ: 0,
  };
}

function _removeUfo() {
  if (!_ufo) return;
  const u = _ufo;
  if (u.carMesh.parent) u.carMesh.parent.remove(u.carMesh);
  u.carMesh.geometry.dispose(); u.carMesh.material.dispose();
  if (u.ufoGrp.parent) u.ufoGrp.parent.remove(u.ufoGrp);
  u.ufoGrp.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
  if (u.beamPts.parent) u.beamPts.parent.remove(u.beamPts);
  u.beamPts.geometry.dispose(); u.beamPts.material.dispose();
  _ufo = null;
  _ufoTimer = UFO_SPAWN_INTERVAL;
}

function _tickUfo(dt) {
  if (!_ufo) return;
  const u = _ufo;
  const sw = u.sw;
  u.timer += dt;
  u.spinAngle += dt * 0.37;

  // Chase-light ring
  u.lightTimer += dt;
  if (u.lightTimer > 0.24) {
    u.lightTimer = 0;
    u.lightIdx = (u.lightIdx + 1) % u.nLights;
    for (let i = 0; i < u.nLights; i++) {
      const d = Math.min(Math.abs(i - u.lightIdx), u.nLights - Math.abs(i - u.lightIdx));
      u.lightMats[i].color.setRGB(d === 0 ? 1 : 0.1, d <= 1 ? 0.8 : 0.08, d === 0 ? 0 : 0.05);
    }
  }

  // Compute UFO world position for this frame
  let px, py, pz;

  if (u.state === 'from_planet') {
    const prog = Math.min(1, u.timer / u.fromPlanetDur);
    const ease = prog * prog * (3 - 2 * prog);
    px = u.fromPlanetX + (u.startX - u.fromPlanetX) * ease;
    py = u.fromPlanetY + (u.startY - u.fromPlanetY) * ease;
    pz = u.fromPlanetZ + (u.startZ - u.fromPlanetZ) * ease;
    if (prog >= 1) { u.state = 'incoming'; u.timer = 0; }

  } else if (u.state === 'incoming') {
    const prog = Math.min(1, u.timer / u.incomingDur);
    const ease = prog < 0.5 ? 2*prog*prog : -1 + (4 - 2*prog)*prog;
    px = u.startX + (u.targetX - u.startX) * ease;
    py = u.startY + (u.targetY - u.startY) * ease;
    pz = u.startZ + (u.targetZ - u.startZ) * ease;
    if (prog >= 1) { u.state = 'hovering'; u.timer = 0; }

  } else if (u.state === 'hovering') {
    const bob = Math.sin(u.timer * 0.83) * sw * 0.5;
    px = u.targetX + u.nx*bob; py = u.targetY + u.ny*bob; pz = u.targetZ + u.nz*bob;
    const beamAlpha = Math.min(0.72, u.timer / u.hoverDur * 0.72);
    u.beamPts.material.opacity = beamAlpha;
    u.beamLight.intensity = beamAlpha * sw * 14;
    if (u.timer >= u.hoverDur) { u.state = 'lifting'; u.timer = 0; }

  } else if (u.state === 'lifting') {
    const prog = Math.min(1, u.timer / u.liftDur);
    const ease = prog * prog * (3 - 2 * prog);
    const bob = Math.sin(u.timer * 0.5) * sw * 0.3;
    px = u.targetX + u.nx*bob; py = u.targetY + u.ny*bob; pz = u.targetZ + u.nz*bob;
    // UFO underside along surface normal
    const ubx = px - u.nx*u.ufoR*0.22, uby = py - u.ny*u.ufoR*0.22, ubz = pz - u.nz*u.ufoR*0.22;
    u.carMesh.position.set(u.cx + (ubx-u.cx)*ease, u.cy + (uby-u.cy)*ease, u.cz + (ubz-u.cz)*ease);
    u.carMesh.rotation.y += dt * ease * 0.73;
    u.beamPts.material.opacity = 0.72;
    u.beamLight.intensity = sw * 14;
    if (prog >= 1) { u.carMesh.visible = false; u.state = 'absorbed'; u.timer = 0; }

  } else if (u.state === 'absorbed') {
    px = u.targetX; py = u.targetY; pz = u.targetZ;
    const beamAlpha = Math.max(0, 0.72 * (1 - u.timer / u.absorbDur));
    u.beamPts.material.opacity = beamAlpha;
    u.beamLight.intensity = beamAlpha * sw * 14;
    if (u.timer >= u.absorbDur) {
      u.departFromX = px; u.departFromY = py; u.departFromZ = pz;
      u.state = 'departing'; u.timer = 0;
    }

  } else if (u.state === 'departing') {
    const prog = Math.min(1, u.timer / u.departDur);
    const ease = prog * prog;
    px = u.departFromX + (u.departX - u.departFromX) * ease;
    py = u.departFromY + (u.departY - u.departFromY) * ease;
    pz = u.departFromZ + (u.departZ - u.departFromZ) * ease;
    u.spinAngle += dt * prog * 1.33;
    if (prog >= 1) { u.state = 'to_planet'; u.timer = 0; }

  } else { // to_planet
    const prog = Math.min(1, u.timer / u.toPlanetDur);
    const ease = prog * prog;
    if (u.toPlanetMesh) {
      const tp = currentObj.worldToLocal(u.toPlanetMesh.position.clone());
      u._tpx = tp.x; u._tpy = tp.y; u._tpz = tp.z;
    } else {
      u._tpx = u.departX; u._tpy = u.departY; u._tpz = u.departZ;
    }
    px = u.departX + (u._tpx - u.departX) * ease;
    py = u.departY + (u._tpy - u.departY) * ease;
    pz = u.departZ + (u._tpz - u.departZ) * ease;
    u.spinAngle += dt * prog * 1.33;
    if (prog >= 1) { _removeUfo(); return; }
  }

  // UFO matrix: disc lies in tangent plane (normal = local Y), spins around normal
  const cr = Math.cos(u.spinAngle), sr = Math.sin(u.spinAngle);
  const srx = cr*u.rx + sr*u.fwx, sry = cr*u.ry + sr*u.fwy, srz = cr*u.rz + sr*u.fwz;
  const sfx = -sr*u.rx + cr*u.fwx, sfy = -sr*u.ry + cr*u.fwy, sfz = -sr*u.rz + cr*u.fwz;
  const ela = u.ufoGrp.matrix.elements;
  ela[0]=srx; ela[1]=sry; ela[2]=srz; ela[3]=0;
  ela[4]=u.nx;ela[5]=u.ny;ela[6]=u.nz;ela[7]=0;
  ela[8]=sfx; ela[9]=sfy; ela[10]=sfz;ela[11]=0;
  ela[12]=px; ela[13]=py; ela[14]=pz; ela[15]=1;
  u.ufoGrp.matrixWorldNeedsUpdate = true;

  // Beam: cone from car to UFO underside, spread in tangent plane
  if (u.beamPts.material.opacity > 0.01 && u.carMesh.visible) {
    const ubx = px - u.nx*u.ufoR*0.22, uby = py - u.ny*u.ufoR*0.22, ubz = pz - u.nz*u.ufoR*0.22;
    const cpx = u.carMesh.position.x, cpy = u.carMesh.position.y, cpz = u.carMesh.position.z;
    const bpa = u.beamPts.geometry.attributes.position.array;
    const nb = bpa.length / 3;
    for (let i = 0; i < nb; i++) {
      const bt = Math.random();
      const r = bt * u.ufoR * 0.88 * (0.4 + Math.random() * 0.6);
      const ba = Math.random() * Math.PI * 2;
      const bra = Math.cos(ba)*r, bfa = Math.sin(ba)*r;
      bpa[i*3]   = cpx + (ubx-cpx)*bt + u.rx*bra + u.fwx*bfa;
      bpa[i*3+1] = cpy + (uby-cpy)*bt + u.ry*bra + u.fwy*bfa;
      bpa[i*3+2] = cpz + (ubz-cpz)*bt + u.rz*bra + u.fwz*bfa;
    }
    u.beamPts.geometry.attributes.position.needsUpdate = true;
  }
}


function mergeMeshes(meshes, key) {
  if (!meshes.length) return null;
  const flatGeos = meshes.map(m => {
    m.updateMatrixWorld(true);
    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(m.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
    return g;
  });
  const merged = mergeGeometries(flatGeos);
  flatGeos.forEach(g => g.dispose());
  if (!merged) return null;
  merged.computeVertexNormals();
  const mesh = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ color: colorFor(key), side: THREE.DoubleSide }));
  mesh.userData.colorKey = key;
  return mesh;
}

const COLOR_KEYS = ['base', 'road', 'building', 'wall', 'smallwall', 'window', 'roof', 'beacon'];


function updateColors() {
  if (!currentObj) return;
  currentObj.traverse(c => {
    if (!c.userData.colorKey || !c.material || !c.material.color || c.userData.isEmissiveOverlay) return;
    c.material.color.copy(colorFor(c.userData.colorKey));
  });
}

// Wireframe via lazy-built EdgesGeometry + LineSegments.
// Way cheaper than `material.wireframe = true`:
//   - EdgesGeometry filters coplanar edges (cube → 12 lines, not 18+ triangle edges)
//   - LineBasicMaterial is unlit — no per-fragment lighting
//   - LineSegments uses gl.LINES directly, no triangle→line tessellation per draw
function applyWireframe() {
  if (!currentObj) return;
  const isWire = wireEnabled;
  const opacity = parseFloat(document.getElementById('wire-opacity').value);
  const meshes = [];
  currentObj.traverse(c => { if (c.isMesh && c.userData.colorKey) meshes.push(c); });
  for (const mesh of meshes) {
    let lines = mesh.userData.wireLines;
    if (isWire && !lines) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 1);
      const lmat = new THREE.LineBasicMaterial({
        color: mesh.material.color.clone(),
        transparent: opacity < 1,
        opacity,
      });
      lines = new THREE.LineSegments(edges, lmat);
      lines.userData.colorKey = mesh.userData.colorKey;
      lines.position.copy(mesh.position);
      lines.quaternion.copy(mesh.quaternion);
      lines.scale.copy(mesh.scale);
      mesh.userData.wireLines = lines;
      mesh.parent.add(lines); // sibling, so hiding the mesh doesn't hide it
    }
    mesh.visible = !isWire;
    if (lines) {
      lines.visible = isWire;
      if (isWire) {
        lines.material.opacity = opacity;
        lines.material.transparent = opacity < 1;
        lines.material.needsUpdate = true;
      }
    }
  }
}

function buildRain() {
  if (rainSystem) scene.remove(rainSystem);
  const count = 8000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 250;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainSystem = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.3, transparent: true, opacity: 0.6 }));
  scene.add(rainSystem);
}

function removeRain() {
  if (rainSystem) { scene.remove(rainSystem); rainSystem = null; }
}

function updateRain() {
  if (!rainSystem) return;
  const pos = rainSystem.geometry.attributes.position;
  const arr = pos.array;
  const n = pos.count * 3;
  for (let i = 1; i < n; i += 3) {
    arr[i] -= 0.8;
    if (arr[i] < -80) arr[i] = 120;
  }
  pos.needsUpdate = true;
}

// ── Animation loop ────────────────────────────────────────
let flyT = 0;
let dayNightPaused = false;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();

  if (currentObj) {
    if (sunEnabled && !dayNightPaused) {
      flyT += 0.0002 * Math.max(0.15, Math.min(1, Math.abs(Math.sin(flyT)) * 2.5));
      document.getElementById('tod-slider').value = (flyT % (Math.PI * 2)) / (Math.PI * 2);
    }
    // directional light always follows flyT
    const sunY = Math.sin(flyT);
    if (_windowMat) {
      _windowMat.uniforms.uTime.value  += dt;
      _windowMat.uniforms.uNight.value  = sunEnabled
        ? Math.max(0, Math.min(1, (0.12 - sunY) / 0.35))
        : 0;
    }
    if (_beaconMat) _beaconMat.uniforms.uTime.value += dt;
    if (_wallGlowMat) {
      _wallGlowMat.uniforms.uTime.value  += dt;
      _wallGlowMat.uniforms.uNight.value  = sunEnabled
        ? Math.max(0, Math.min(1, (0.12 - sunY) / 0.35))
        : 0;
    }
    sun.position.set(Math.cos(flyT) * 400, sunY * 400, 0);
    window._starMat.opacity = sunEnabled ? Math.max(0, Math.min(1, (-sunY - 0.2) / 0.4)) : 0;
    {
      const _sy   = Math.sin(flyT);
      const _dayT = Math.max(0, _sy);
      const _sset = Math.exp(-(_sy*_sy)/(0.25*0.25));
      const cr = 1, cg = sunEnabled ? Math.max(0.5, 0.55+_dayT*0.45-_sset*0.25) : 0.62;
      const cb = sunEnabled ? Math.max(0.3, 0.38+_dayT*0.62-_sset*0.45) : 0.42;
      for (const c of _clouds) {
        for (const { sprite, mat, bright, blueShft } of c.splats) {
          if (!dayNightPaused) { sprite.position.x += c.driftX*dt; sprite.position.z += c.driftZ*dt; }
          mat.color.setRGB(Math.min(1,bright*cr), Math.min(1,bright*cg), Math.min(1,(bright+blueShft)*cb));
        }
        if (!dayNightPaused && c.dbg) { c.dbg.position.x += c.driftX*dt; c.dbg.position.z += c.driftZ*dt; }
      }
    }

    if (sunEnabled) {
      const t = Math.max(0, sunY);
      const night = 1 - t;
      const horizonBand = Math.exp(-Math.pow(sunY / 0.18, 2));
      const skyR = night * 0.04 + horizonBand * 0.55 + t * 0.30;
      const skyG = night * 0.04 + horizonBand * 0.10 + t * 0.38;
      const skyB = night * 0.08 + horizonBand * 0.02 + t * 0.40;
      _bgColor.setRGB(skyR, skyG, skyB);
      scene.background = _bgColor;
      ambient.intensity = 0.1 + t * 0.9;
      sun.color.setRGB(1, 0.3 + t * 0.65, horizonBand * 0.1 + t * 0.65);
      _sunSphere.position.copy(sun.position);
      const sunFade = Math.min(1, Math.max(0, (sunY + 0.35) / 0.2));
      _sunSphere.visible = sunFade > 0;
      _sunSphereMat.opacity = sunFade;
      const horizon = Math.min(1, Math.max(0, sunY / 0.25));
      _sunSphereMat.color.setRGB(1, 0.15 + horizon * 0.7, horizon * 0.55);
    }

    if (rainSystem) updateRain();
  }

  if (_freeCam) _tickFreeCamera(dt);
  else controls.update();

  if (carsEnabled) updateCars(dt);
  _tickFire(dt);
  _tickUfo(dt);
  _tickTornado(dt);
  _tickBirds(dt);
  _tickSolar(dt);
  renderer.render(scene, camera);
});

  const config = {
    seed:              parseInt(document.getElementById('gen-seed').value),
    city_width:        parseInt(document.getElementById('gen-width').value),
    city_depth:        parseInt(document.getElementById('gen-depth').value),
    block_width:       parseInt(document.getElementById('gen-block').value),
    block_depth:       parseInt(document.getElementById('gen-block').value),
    street_width:      parseInt(document.getElementById('gen-street').value),
    max_floors:        parseInt(document.getElementById('gen-floors').value),
    dist:              document.getElementById('gen-dist').value,
    num_highways:      parseInt(document.getElementById('gen-hw').value),
    voronoi_boulevards:document.getElementById('gen-voronoi').checked,
    voronoi_sites:     parseInt(document.getElementById('gen-vsites').value),
    diagonal_road:     document.getElementById('gen-diagonal').checked,

    window_min_floors: document.getElementById('gen-windows').checked ? 4 : 999,
    add_base:          document.getElementById('gen-base').checked,
    surface:           document.getElementById('gen-surface').value,
    sphere_radius:     parseInt(document.getElementById('gen-sradius').value),
    torus_major:       parseInt(document.getElementById('gen-tmajor').value),
    torus_minor:       parseInt(document.getElementById('gen-tminor').value),
  };

  genWorker.onmessage = e => {
    btn.disabled = false;
    btn.textContent = 'Generate';
    if (!e.data.ok) {
      genStatus.textContent = 'Error: ' + e.data.error;
      console.error(e.data.error);
      return;
    }

    const { objects, surface: genSurface, traffic } = e.data;
    genStatus.textContent = `${genSurface ?? 'flat'} — ${objects.length} objects`;

    // Build Three.js group from typed arrays
    if (currentObj) {
      _removeFire();
      _removeUfo();
      _removeTornado();
      removeCars();
      scene.remove(currentObj);
      currentObj.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
    }

    // Group raw geometry by color category — one draw call per element type
    const groupBuf = Object.fromEntries(COLOR_KEYS.map(k => [k, { totalIdx: 0, parts: [] }]));
    for (const { name, verts, faces, uvs, subUVs } of objects) {
      const k = colorKey(name);
      if (groupBuf[k]) { groupBuf[k].parts.push({ verts, faces, uvs, subUVs }); groupBuf[k].totalIdx += faces.length; }
    }

    const group = new THREE.Group();
    for (const key of COLOR_KEYS) {
      const g = groupBuf[key];
      if (!g.totalIdx) continue;
      const positions = new Float32Array(g.totalIdx * 3);
      let off = 0;
      for (const { verts, faces } of g.parts) {
        for (let i = 0; i < faces.length; i++) {
          const idx = faces[i] * 3;
          positions[off++] = verts[idx];
          positions[off++] = verts[idx + 1];
          positions[off++] = verts[idx + 2];
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      if (key === 'window') {
        const uvArr    = new Float32Array(g.totalIdx * 2);
        const subUVArr = new Float32Array(g.totalIdx * 2);
        let uvOff = 0, sOff = 0;
        for (const { uvs, subUVs, faces } of g.parts) {
          for (let i = 0; i < faces.length; i++) {
            const vi = faces[i];
            uvArr[uvOff++]    = uvs    ? uvs[vi * 2]        : 0;
            uvArr[uvOff++]    = uvs    ? uvs[vi * 2 + 1]    : 0;
            subUVArr[sOff++]  = subUVs ? subUVs[vi * 2]     : 0;
            subUVArr[sOff++]  = subUVs ? subUVs[vi * 2 + 1] : 0;
          }
        }
        geo.setAttribute('uv',     new THREE.BufferAttribute(uvArr,    2));
        geo.setAttribute('aSubUV', new THREE.BufferAttribute(subUVArr, 2));
      }
      geo.computeVertexNormals();
      let mat;
      if (key === 'window') {
        mat = new THREE.MeshPhongMaterial({ color: colorFor('window'), shininess: 80, specular: new THREE.Color(0x4466aa), side: THREE.DoubleSide });
        const emissiveMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uWindowTex: { value: _roomTex } },
          vertexShader: `
            attribute vec2 aSubUV;
            varying vec2 vPaneID;
            varying vec2 vSubUV;
            varying vec3 vWorldPos;
            void main() {
              vPaneID   = uv;
              vSubUV    = aSubUV;
              vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }`,
          fragmentShader: `
            varying vec2 vPaneID;
            varying vec2 vSubUV;
            varying vec3 vWorldPos;
            uniform float uTime;
            uniform float uNight;
            uniform sampler2D uWindowTex;
            void main() {
              vec2 pid = vPaneID + vec2(0.37, 0.71);
              float wh = fract(sin(dot(pid, vec2(127.1, 311.7))) * 43758.5453);
              vec2 blockID = floor(vPaneID / vec2(3.0, 2.0)) + vec2(0.37, 0.71);
              float bh = fract(sin(dot(blockID, vec2(127.1, 311.7))) * 43758.5453);
              float bPeriod = 600.0 + bh * 1200.0;
              float bSlot = floor(uTime / bPeriod);
              float bSlotHash = fract(sin(dot(vec2(bh * 131.7, bSlot), vec2(127.1, 311.7))) * 43758.5453);
              float blockLit = step(0.78, bSlotHash);
              float fineH = fract(sin(dot(pid, vec2(211.3, 97.7))) * 43758.5453);
              float fPeriod = 750.0 + fineH * 1350.0;
              float fSlot = floor(uTime / fPeriod);
              float fSlotHash = fract(sin(dot(vec2(fineH * 173.1, fSlot), vec2(311.7, 127.1))) * 43758.5453);
              float loneLit = step(0.80, fSlotHash);
              float lit = max(blockLit, loneLit) * step(0.2, wh);
              vec3 bq = floor(vWorldPos / 20.0);
              float buildingH = fract(sin(dot(bq, vec3(191.3, 463.7, 217.1))) * 43758.5453);
              float buildingBright = mix(0.65, 0.8, buildingH);
              float windowBright = mix(0.9, 1.0, wh);
              float ah = fract(sin(dot(pid + vec2(13.7, 91.3), vec2(431.1, 271.9))) * 93751.2453);
              float onThresh = mix(0.05, 0.95, ah);
              float nightFactor = smoothstep(onThresh - 0.12, onThresh + 0.12, uNight);
              // sample room interior atlas — 64x64 grid of 32x32 cells
              float cellIdx = floor(wh * 4096.0);
              float cellCol = mod(cellIdx, 64.0);
              float cellRow = floor(cellIdx / 64.0);
              vec2 atlasUV = vec2(
                (cellCol + vSubUV.x) / 64.0,
                (63.0 - cellRow + vSubUV.y) / 64.0
              );
              float roomSilhouette = texture2D(uWindowTex, atlasUV).r;
              float roomFactor = 1.0 - roomSilhouette * 0.55;
              float em = lit * nightFactor * pow(uNight, 0.4) * buildingBright * windowBright * roomFactor;
              vec3 warm  = vec3(1.0, 0.65, 0.2);
              vec3 white = vec3(0.95, 0.95, 1.0);
              vec3 col = mix(warm, white, step(0.5, buildingH));
              gl_FragColor = vec4(col * em, 1.0);
            }`,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1,
          side: THREE.DoubleSide,
        });
        _windowMat = emissiveMat;
        const emissiveMesh = new THREE.Mesh(geo, emissiveMat);
        emissiveMesh.userData.isEmissiveOverlay = true;
        group.add(emissiveMesh);
      } else if (key === 'beacon') {
        const beaconMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 } },
          vertexShader: `
            varying vec3 vWorldPos;
            void main() {
              vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }`,
          fragmentShader: `
            varying vec3 vWorldPos;
            uniform float uTime;
            void main() {
              // unique phase per beacon derived from its world position
              vec2 bGrid = floor(vWorldPos.xz + 0.5);
              float phase = fract(sin(dot(bGrid, vec2(127.1, 311.7))) * 43758.5453);
              float t = mod(uTime + phase * 4.0, 4.0);
              float white = smoothstep(0.0, 0.10, t) * smoothstep(0.55, 0.38, t);
              float red   = smoothstep(2.0, 2.10, t) * smoothstep(2.55, 2.38, t);
              vec3 col = vec3(1.0, 0.95, 0.9) * white * 4.0
                       + vec3(1.0, 0.05, 0.0) * red   * 2.5;
              gl_FragColor = vec4(col, 1.0);
            }`,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          depthTest: true,
          side: THREE.DoubleSide,
        });
        _beaconMat = beaconMat;
        group.add(new THREE.Mesh(geo, beaconMat));
        continue;
      } else if (key === 'wall') {
        mat = new THREE.MeshLambertMaterial({ color: colorFor(key), side: THREE.DoubleSide });
      } else if (key === 'smallwall') {
        mat = new THREE.MeshLambertMaterial({ color: colorFor('wall'), side: THREE.DoubleSide });
      } else {
        mat = new THREE.MeshLambertMaterial({ color: colorFor(key), side: THREE.DoubleSide });
      }
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData.colorKey = key;
      group.add(mesh);
    }

    // Auto-centre and scale
    const box3 = new THREE.Box3().setFromObject(group);
    const size3 = box3.getSize(new THREE.Vector3());
    const center3 = box3.getCenter(new THREE.Vector3());
    autoScale = 80 / Math.max(size3.x, size3.y, size3.z);
    if (_wallGlowMat) _wallGlowMat.uniforms.uScale.value = autoScale;
    modelCenter.copy(center3);
    group.scale.setScalar(autoScale);
    group.position.copy(center3).multiplyScalar(-autoScale);

    scene.add(group);
    currentObj = group;
    applyWireframe();
    trafficData = null; adjacency = {};
    buildAdjacency(traffic); trafficData = traffic;
    if (carsEnabled) spawnCars();
    status.textContent = `Generated — ${objects.length} objects`;

    // Build OBJ for download
    lastObjText = buildObjText(objects, config.seed);
    document.getElementById('btn-download').style.display = 'block';
  };

  genWorker.postMessage(config);
});

// ── Initial generate ──────────────────────────────────────
document.getElementById('btn-generate').click();

document.getElementById('btn-download').addEventListener('click', () => {
  if (!lastObjText) return;
  const blob = new Blob([lastObjText], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `city_seed${document.getElementById('gen-seed').value}.obj`;
  a.click();
  URL.revokeObjectURL(a.href);
});

function buildObjText(objects, seed) {
  const lines = [`# Generated by procity (seed ${seed})`];
  let offset = 1;
  for (const { name, verts, faces } of objects) {
    lines.push(`o ${name}`);
    for (let i = 0; i < verts.length; i += 3)
      lines.push(`v ${verts[i].toFixed(6)} ${verts[i+1].toFixed(6)} ${verts[i+2].toFixed(6)}`);
    for (let i = 0; i < faces.length; i += 3)
      lines.push(`f ${faces[i]+offset} ${faces[i+1]+offset} ${faces[i+2]+offset}`);
    offset += verts.length / 3;
  }
  return lines.join('\n');
}
</script>
</body>
