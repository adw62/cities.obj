<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>City OBJ Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 10;
      border-bottom: 1px solid #222;
    }

    #topbar h1 { font-size: 13px; color: #888; white-space: nowrap; }


    .mode-btn {
      background: #111;
      border: 1px solid #333;
      color: #aaa;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:hover { background: #1e1e2e; color: #fff; }
    .mode-btn.active { background: #2a4a8a; color: #8af; border-color: #4a6aaa; }

    /* ── Side panel ── */
    .panel-section label {
      display: block;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #4a8af4;
    }

    input[type=color] {
      width: 100%;
      height: 24px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: none;
    }

    #music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    #music-title {
      font-size: 11px;
      color: #666;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: #444;
      z-index: 10;
    }

    #left-panels {
      position: fixed;
      top: 48px; left: 0;
      width: 200px;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    #gen-panel, #events-panel {
      width: 200px;
      background: rgba(0,0,0,0.85);
      border-right: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    #gen-panel label {
      display: block;
      color: #666;
      margin-bottom: 3px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    #gen-panel input[type=number],
    #gen-panel select {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #eee;
      padding: 3px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
    }

    #gen-panel input[type=range] { width: 100%; accent-color: #4a8af4; }
    #gen-panel input[type=checkbox] { accent-color: #4a8af4; }

    #btn-generate {
      background: #2a4a8a;
      border: 1px solid #4a6aaa;
      color: #8af;
      padding: 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    #btn-generate:hover { background: #3a5aaa; }
    #btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-download {
      background: #1a3a1a;
      border: 1px solid #3a6a3a;
      color: #6f6;
      padding: 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      display: none;
    }
    #btn-download:hover { background: #2a4a2a; }

    #gen-status { color: #666; font-size: 10px; min-height: 14px; }

  </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="left-panels">
<!-- Generator panel -->
<div id="gen-panel">

    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-base" checked> Base plate</label>

  <button id="btn-generate">Generate</button>
  <button id="btn-download">Download OBJ</button>

</div>

<!-- Events panel -->

{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ── Scene / Camera ────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 80000);
camera.position.set(0, 60, 120);

// ── Lights ────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4cc, 1.2);
sun.position.set(100, 150, 80);
scene.add(sun);

const _sunSphereMat = new THREE.MeshBasicMaterial({ color: 0xfff4cc, transparent: true });
const _sunSphere = new THREE.Mesh(new THREE.SphereGeometry(30, 24, 24), _sunSphereMat);
_sunSphere.visible = false;
scene.add(_sunSphere);

// ── Stars ─────────────────────────────────────────────────
{
  const count = 2500;
  const pos   = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 5000;
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  window._starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false, transparent: true, opacity: 1, depthWrite: false });
  scene.add(new THREE.Points(geo, window._starMat));
}

// ── Volumetric clouds ─────────────────────────────────────
// ── Gaussian splat clouds ─────────────────────────────────
function _makeGaussTex(sigma = 0.42) {
  const S = 128, h = S / 2;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(S, S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = (x - h) / h, dy = (y - h) / h;
      const a = Math.exp(-(dx*dx + dy*dy) / (2*sigma*sigma));
      const i = (y*S + x)*4;
      img.data[i] = img.data[i+1] = img.data[i+2] = 255;
      img.data[i+3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}

function _cloudGraph(n) {
  const SC = 1;
  const nodes = Array.from({ length: n }, () => new THREE.Vector3(
    (Math.random()-0.5)*100*SC, (Math.random()-0.5)*30*SC, (Math.random()-0.5)*70*SC
  ));
  const edges = [], inTree = new Set([0]);
  while (inTree.size < n) {
    let best = null, bestDist = Infinity;
    for (const a of inTree) for (let b = 0; b < n; b++) {
      if (inTree.has(b)) continue;
      const d = nodes[a].distanceTo(nodes[b]);
      if (d < bestDist) { bestDist = d; best = [a, b]; }
    }
    edges.push(best); inTree.add(best[1]);
  }
  const extras = 1 + Math.floor(Math.random()*3);
  for (let e = 0; e < extras; e++) {
    const a = Math.floor(Math.random()*n);
    let b = Math.floor(Math.random()*(n-1)); if (b >= a) b++;
    if (!edges.some(([ea,eb]) => (ea===a&&eb===b)||(ea===b&&eb===a))) edges.push([a,b]);
  }
  return { nodes, edges };
}

function _layoutGraph(nodes, edges) {
  const SC = 1;
  const n = nodes.length, vel = nodes.map(()=>new THREE.Vector3()), f = nodes.map(()=>new THREE.Vector3()), tmp = new THREE.Vector3();
  for (let iter = 0; iter < 200; iter++) {
    for (const fi of f) fi.set(0,0,0);
    for (let i = 0; i < n; i++) for (let j = i+1; j < n; j++) {
      tmp.subVectors(nodes[i], nodes[j]);
      const dist = Math.max(tmp.length(), 0.5), mag = 2200 / (dist*dist);
      tmp.normalize().multiplyScalar(mag); f[i].add(tmp); f[j].sub(tmp);
    }
    for (const [a,b] of edges) {
      tmp.subVectors(nodes[b], nodes[a]);
      const mag = 0.09 * (tmp.length() - 55*SC);
      tmp.normalize().multiplyScalar(mag); f[a].add(tmp); f[b].sub(tmp);
    }
    for (let i = 0; i < n; i++) { vel[i].addScaledVector(f[i], 0.1).multiplyScalar(0.87); nodes[i].add(vel[i]); }
  }
  for (const p of nodes) p.y *= 0.48;
}

function _cloudBeads(nodes, edges) {
  const SC = 3, beads = [];
  for (const p of nodes) {
    const r = (18 + Math.random()*12)*SC;
    beads.push({ center: p.clone(), radius: r });
    if (Math.random() > 0.35) {
      const jit = new THREE.Vector3((Math.random()-.5)*r*.7,(Math.random()-.5)*r*.35,(Math.random()-.5)*r*.7);
      beads.push({ center: p.clone().add(jit), radius: r*(0.45+Math.random()*0.4) });
    }
  }
  for (const [a,b] of edges) {
    const pa = nodes[a], pb = nodes[b], dist = pa.distanceTo(pb);
    const steps = Math.max(1, Math.floor(dist/(12*SC)));
    const ra = beads.find(bd => bd.center.equals(pa))?.radius ?? 20*SC;
    const rb = beads.find(bd => bd.center.equals(pb))?.radius ?? 20*SC;
    for (let i = 1; i < steps; i++) {
      const t = i/steps, r = THREE.MathUtils.lerp(ra,rb,t)*(0.5+Math.random()*0.35);
      const jit = new THREE.Vector3((Math.random()-.5)*21,(Math.random()-.5)*12,(Math.random()-.5)*21);
      beads.push({ center: pa.clone().lerp(pb,t).add(jit), radius: r });
    }
  }
  return beads;
}

function _sampleSphere(center, radius, out) {
  let x, y, z;
  do { x=(Math.random()*2-1)*radius; y=(Math.random()*2-1)*radius; z=(Math.random()*2-1)*radius; }
  while (x*x+y*y+z*z > radius*radius);
  return out.set(center.x+x, center.y+y, center.z+z);
}

const _GAUSS_TEX = _makeGaussTex();
let _clouds = [];
let _cloudDebug = false;

function _buildCloud(cx, cy, cz) {
  const { nodes, edges } = _cloudGraph(5 + Math.floor(Math.random()*4));
  _layoutGraph(nodes, edges);
  // Capture local-space positions before world offset for debug geometry
  const localNodes = nodes.map(p => p.clone());
  const offset = new THREE.Vector3(cx, cy, cz);
  for (const p of nodes) p.add(offset);
  const beads = _cloudBeads(nodes, edges);
  const totalVol = beads.reduce((s,b) => s + b.radius**3, 0);
  const pos = new THREE.Vector3(), splats = [];
  const numSplats = 180 + Math.floor(Math.random()*80);
  for (let i = 0; i < numSplats; i++) {
    let pick = Math.random()*totalVol, bead;
    for (bead of beads) { pick -= bead.radius**3; if (pick <= 0) break; }
    _sampleSphere(bead.center, bead.radius, pos);
    const baseW  = (8 + Math.random()*17)*3;
    const aspect = 0.45 + Math.random()*1.05;
    const opac   = 0.038 + Math.random()*0.105;
    const heightT = (pos.y - cy + 50) / 100;
    const bright  = 0.84 + Math.random()*0.16 + heightT*0.04;
    const blueShft = Math.random()*0.06;
    const mat = new THREE.SpriteMaterial({
      map: _GAUSS_TEX, transparent: true, depthWrite: false, opacity: opac,
      color: new THREE.Color(Math.min(1,bright), Math.min(1,bright), Math.min(1,bright+blueShft)),
    });
    mat.rotation = Math.random()*Math.PI;
    const sprite = new THREE.Sprite(mat);
    sprite.position.copy(pos);
    sprite.scale.set(baseW, baseW*aspect, 1);
    scene.add(sprite);
    splats.push({ sprite, mat, opac, bright, blueShft });
  }
  // Debug graph — edges as cyan lines, nodes as yellow points (local space, Group at cloud centre)
  const dbg = new THREE.Group();
  dbg.position.set(cx, cy, cz);
  const edgePos = [];
  for (const [a, b] of edges) {
    const pa = localNodes[a], pb = localNodes[b];
    edgePos.push(pa.x, pa.y, pa.z, pb.x, pb.y, pb.z);
  }
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
  dbg.add(new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x00ffff })));
  const nodePos = [];
  for (const p of localNodes) nodePos.push(p.x, p.y, p.z);
  const ptGeo = new THREE.BufferGeometry();
  ptGeo.setAttribute('position', new THREE.Float32BufferAttribute(nodePos, 3));
  dbg.add(new THREE.Points(ptGeo, new THREE.PointsMaterial({ color: 0xffff00, size: 6, sizeAttenuation: false })));
  dbg.visible = _cloudDebug;
  scene.add(dbg);

  return { splats, dbg };
}

function _spawnClouds() {
  for (const c of _clouds) {
    for (const { sprite, mat } of c.splats) { scene.remove(sprite); mat.dispose(); }
    if (c.dbg) { scene.remove(c.dbg); c.dbg.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
  }
  _clouds = [];
  const count = parseInt(document.getElementById('cloud-count').value);
  for (let i = 0; i < count; i++) {
    const cx = (Math.random()-0.5)*1400, cz = (Math.random()-0.5)*1400;

    const { splats, dbg } = _buildCloud(cx, cy, cz);
    _clouds.push({ splats, dbg, driftX:(Math.random()-0.5)*1.5, driftZ:(Math.random()-0.5)*1.5 });
  }
}

// ── Planet canvas textures ────────────────────────────────
function _makePlanetTex(hue) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  const col = (h, s, l, a = 1) => `hsla(${(h % 1) * 360},${s}%,${l}%,${a})`;
  ctx.fillStyle = col(hue, 65, 42);
  ctx.fillRect(0, 0, S, S);
  // Horizontal atmospheric bands
  const bands = 6 + Math.floor(Math.random() * 6);
  for (let i = 0; i < bands; i++) {
    const y = (i / bands) * S;
    const bh = S / bands * (0.4 + Math.random() * 0.8);
    const dh = (Math.random() - 0.5) * 0.15;
    const dl = 30 + Math.random() * 40;
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0,   col(hue + dh, 70, dl, 0));
    grad.addColorStop(0.5, col(hue + dh, 70, dl, 0.85));
    grad.addColorStop(1,   col(hue + dh, 70, dl, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, S, bh);
  }
  // Highlight bands — wide soft stripes of a lighter/complementary hue under the swirls
  const hBands = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < hBands; i++) {
    const y = Math.random() * S;
    const bh = 8 + Math.random() * 20;
    const dh = 0.08 + Math.random() * 0.18; // shift toward complementary
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0,   col(hue + dh, 80, 78, 0));
    grad.addColorStop(0.5, col(hue + dh, 80, 78, 0.28));
    grad.addColorStop(1,   col(hue + dh, 80, 78, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, y, S, bh);
  }
  // Swirl details — sine-wavy horizontal strokes
  for (let y = 0; y < S; y += 3) {
    const amp = 4 + Math.random() * 8;
    const periods = 2 + Math.floor(Math.random() * 5); // integer cycles → seamless wrap
    const freq = periods / S;
    ctx.beginPath();
    for (let x = 0; x <= S; x++) {
      const yy = y + Math.sin(x * freq * Math.PI * 2) * amp;
      x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
    }
    ctx.strokeStyle = col(hue + (Math.random() - 0.5) * 0.1, 60, 55 + Math.random() * 20, 0.32);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  // Cloud noise — scattered white blobs in a horizontal band pattern
  const cloudRows = 18 + Math.floor(Math.random() * 12);
  for (let i = 0; i < cloudRows; i++) {
    const cy = Math.random() * S;
    const blobs = 6 + Math.floor(Math.random() * 10);
    for (let j = 0; j < blobs; j++) {
      const cx = Math.random() * S;
      const r  = 3 + Math.random() * 9;
      const g  = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,   `rgba(255,255,255,${0.06 + Math.random() * 0.10})`);
      g.addColorStop(1,   'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
  }
  // Polar highlight
  const pg = ctx.createRadialGradient(S / 2, 4, 0, S / 2, 4, S * 0.38);
  pg.addColorStop(0, 'rgba(255,255,255,0.55)');
  pg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = pg;
  ctx.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}


// ── Rocky planet textures ─────────────────────────────────
function _makeRockyTex(hue, seed, type = 'rock') {
  const S = 256;
  // Seeded pseudo-random via simple hash
  let _s = seed | 0;
  function rng() { _s = (_s * 1664525 + 1013904223) & 0xffffffff; return (_s >>> 0) / 0xffffffff; }
  // 3D value noise — seamless horizontal wrapping by sampling on a cylinder
  function hash3(ix, iy, iz) {
    let h = (ix * 374761393 ^ iy * 668265263 ^ iz * 1013904223) + ((_s * 982451653) | 0);
    h = ((h ^ (h >>> 13)) * 1274126177) | 0;
    return ((h >>> 0) & 0x7fffffff) / 0x7fffffff;
  }
  function noise3(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const fx = x-xi, fy = y-yi, fz = z-zi;
    const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy), uz = fz*fz*(3-2*fz);
    const v000=hash3(xi,yi,zi), v100=hash3(xi+1,yi,zi), v010=hash3(xi,yi+1,zi), v110=hash3(xi+1,yi+1,zi);
    const v001=hash3(xi,yi,zi+1), v101=hash3(xi+1,yi,zi+1), v011=hash3(xi,yi+1,zi+1), v111=hash3(xi+1,yi+1,zi+1);
    return v000*(1-ux)*(1-uy)*(1-uz)+v100*ux*(1-uy)*(1-uz)+v010*(1-ux)*uy*(1-uz)+v110*ux*uy*(1-uz)
          +v001*(1-ux)*(1-uy)*uz+v101*ux*(1-uy)*uz+v011*(1-ux)*uy*uz+v111*ux*uy*uz;
  }
  // FBM helper: px∈[0,1] maps to a circle so left/right edges are seamless
  function makeFbm(scale, octaves) {
    const r = scale / (Math.PI * 2);
    const sz = scale * 0.8;
    return (px, py) => {
      const cx = Math.cos(px * Math.PI * 2) * r;
      const cy = Math.sin(px * Math.PI * 2) * r;
      const cz = py * sz;
      let v = 0, amp = 0.5, freq = 1, max = 0;
      for (let o = 0; o < octaves; o++) {
        v += noise3(cx*freq, cy*freq, cz*freq) * amp;
        max += amp; amp *= 0.5; freq *= 2.1;
      }
      return v / max;
    };
  }
  // Primary heightmap — lower frequency (larger features)
  const scale = 8 + rng() * 5;
  const fbm = makeFbm(scale, 6);
  // Secondary flat highlight layer — even lower frequency, fewer octaves
  const fbmHi = makeFbm(scale * 0.35, 3);
  // Build heightmap + highlight map
  const hmap = new Float32Array(S * S);
  const himap = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    hmap[y * S + x]  = fbm(x / S, y / S);
    himap[y * S + x] = fbmHi(x / S, y / S);
  }
  // Colour palette — varies by type
  let col;
  if (type === 'black') {
    col = (h, hi) => {
      const t1 = Math.min(1, Math.max(0, h / 0.5));
      const t2 = Math.min(1, Math.max(0, (h - 0.5) / 0.5));
      let r = 0.04 + t1 * 0.11 + t2 * 0.14;
      let g = 0.04 + t1 * 0.10 + t2 * 0.13;
      let b = 0.05 + t1 * 0.11 + t2 * 0.15;
      return [r * 255, g * 255, b * 255];
    };
  } else if (type === 'ice') {
    col = (h, hi) => {
      // deep shadow ice → bright surface ice → pure white peaks
      const t1 = Math.min(1, Math.max(0, h / 0.45));
      const t2 = Math.min(1, Math.max(0, (h - 0.45) / 0.55));
      let r = 0.72 + t1 * 0.16 + t2 * 0.10;
      let g = 0.82 + t1 * 0.10 + t2 * 0.06;
      let b = 0.90 + t1 * 0.07 + t2 * 0.03;
      // red bacteria bloom where secondary noise peaks (like Chlamydomonas nivalis)
      const bloom = Math.max(0, (hi - 0.58) / 0.30);
      r = r + (0.82 - r) * bloom;
      g = g + (0.08 - g) * bloom;
      b = b + (0.08 - b) * bloom;
      return [Math.min(255, r * 255), Math.min(255, g * 255), Math.min(255, b * 255)];
    };
  } else if (type === 'water') {
    col = (h, hi) => {
      // ocean deep → ocean shallow → beach → land → highland
      let r, g, b;
      if (h < 0.32) {
        const t = h / 0.32;
        r = (0.03 + t * 0.07); g = (0.10 + t * 0.22); b = (0.42 + t * 0.22);
      } else if (h < 0.42) {
        const t = (h - 0.32) / 0.10;
        r = (0.10 + t * 0.68); g = (0.32 + t * 0.38); b = (0.64 - t * 0.18);
      } else if (h < 0.72) {
        const t = (h - 0.42) / 0.30;
        r = (0.18 + t * 0.16); g = (0.40 - t * 0.06); b = (0.14 + t * 0.10);
      } else {
        const t = Math.min(1, (h - 0.72) / 0.28);
        r = (0.34 + t * 0.22); g = (0.34 + t * 0.18); b = (0.24 + t * 0.22);
      }
      return [Math.min(255, r * 255), Math.min(255, g * 255), Math.min(255, b * 255)];
    };
  } else {
    // Standard rock: reds/greys
    const redBias = 0.5 + hue * 0.5;
    const hiR = redBias * 0.92 + (1 - redBias) * 0.78;
    const hiG = redBias * 0.78 + (1 - redBias) * 0.84;
    const hiB = redBias * 0.55 + (1 - redBias) * 0.92;
    col = (h, hi) => {
      const lo  = { r: 0.18 + redBias * 0.10, g: 0.08,                        b: 0.06 };
      const mid = { r: 0.55 + redBias * 0.12, g: 0.22 + (1 - redBias) * 0.10, b: 0.18 + (1 - redBias) * 0.10 };
      const hih = { r: 0.70 + (1 - redBias) * 0.08, g: 0.65 + (1 - redBias) * 0.08, b: 0.65 + (1 - redBias) * 0.08 };
      const t1 = Math.min(1, Math.max(0, h / 0.45));
      const t2 = Math.min(1, Math.max(0, (h - 0.45) / 0.55));
      let r = lo.r + (mid.r - lo.r) * t1 + (hih.r - mid.r) * t2;
      let g = lo.g + (mid.g - lo.g) * t1 + (hih.g - mid.g) * t2;
      let b = lo.b + (mid.b - lo.b) * t1 + (hih.b - mid.b) * t2;
      const blend = Math.max(0, (hi - 0.62) / 0.28);
      r = r + (hiR - r) * blend; g = g + (hiG - g) * blend; b = b + (hiB - b) * blend;
      return [Math.min(255, r * 255), Math.min(255, g * 255), Math.min(255, b * 255)];
    };
  }
  // Diffuse map canvas
  const dc = document.createElement('canvas'); dc.width = dc.height = S;
  const dctx = dc.getContext('2d');
  const dimg = dctx.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const [r, g, b] = col(hmap[i], himap[i]);
    dimg.data[i * 4]     = r;
    dimg.data[i * 4 + 1] = g;
    dimg.data[i * 4 + 2] = b;
    dimg.data[i * 4 + 3] = 255;
  }
  dctx.putImageData(dimg, 0, 0);
  // Normal map canvas — derive from heightmap gradient
  const nc = document.createElement('canvas'); nc.width = nc.height = S;
  const nctx = nc.getContext('2d');
  const nimg = nctx.createImageData(S, S);
  const strength = 32;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const xm = hmap[y * S + Math.max(0, x - 1)];
    const xp = hmap[y * S + Math.min(S - 1, x + 1)];
    const ym = hmap[Math.max(0, y - 1) * S + x];
    const yp = hmap[Math.min(S - 1, y + 1) * S + x];
    const dx = (xp - xm) * strength;
    const dy = (yp - ym) * strength;
    const len = Math.sqrt(dx * dx + dy * dy + 1);
    const nx = -dx / len, ny = -dy / len, nz = 1 / len;
    const idx = (y * S + x) * 4;
    nimg.data[idx]     = (nx * 0.5 + 0.5) * 255;
    nimg.data[idx + 1] = (ny * 0.5 + 0.5) * 255;
    nimg.data[idx + 2] = (nz * 0.5 + 0.5) * 255;
    nimg.data[idx + 3] = 255;
  }
  nctx.putImageData(nimg, 0, 0);
  return { map: new THREE.CanvasTexture(dc), normalMap: new THREE.CanvasTexture(nc) };
}

// ── Sky: planets ──────────────────────────────────────────
let _solarPlanets = [];

function _spawnPlanets() {
  for (const p of _solarPlanets) {
    scene.remove(p.mesh);
    p.mesh.geometry.dispose();
    if (p.mesh.material.map) p.mesh.material.map.dispose();
    if (p.mesh.material.normalMap) p.mesh.material.normalMap.dispose();
    p.mesh.material.dispose();
    for (const m of (p.moons || [])) {
      scene.remove(m.mesh);
      m.mesh.geometry.dispose();
      if (m.mesh.material.map) m.mesh.material.map.dispose();
      if (m.mesh.material.normalMap) m.mesh.material.normalMap.dispose();
      m.mesh.material.dispose();
    }
    if (p.doomedMoon) {
      const dm = p.doomedMoon;
      scene.remove(dm.mesh); dm.mesh.geometry.dispose();
      if (dm.mesh.material.map) dm.mesh.material.map.dispose();
      if (dm.mesh.material.normalMap) dm.mesh.material.normalMap.dispose();
      dm.mesh.material.dispose();
      scene.remove(dm.ringPoints); dm.ringGeo.dispose(); dm.ringPoints.material.dispose();
    }
  }
  _solarPlanets = [];
  const count = parseInt(document.getElementById('planet-count').value);
  const hueStep = 1 / (count || 1);
  for (let i = 0; i < count; i++) {
    const speed  = 0.0005 + Math.random() * 0.003;
    const tilt   = (Math.random() - 0.5) * 0.6;
    const zOff   = (Math.random() - 0.5) * 150;
    const angle  = Math.random() * Math.PI * 2;
    let mat, r, orbitR;
    let moons = [];
    if (Math.random() < 0.25) {
      // Gas planet — rare, large; blues, greens, yellows: hue 0.12–0.65
      r = 28 + Math.random() * 40;
      orbitR = 800 + Math.random() * 700;
      const gasHue = 0.12 + Math.random() * 0.53;
      const color  = new THREE.Color().setHSL(gasHue, 0.75, 0.58);
      mat = new THREE.MeshPhongMaterial({ color, map: _makePlanetTex(gasHue), shininess: 20 });
      // Spawn 1–3 moons orbiting this gas giant
      const moonCount = Math.random() < 0.35 ? 1 + Math.floor(Math.random() * 3) : 0;
      for (let m = 0; m < moonCount; m++) {
        const mr = 2 + Math.random() * 4;
        const mOrbitR = r * (4.5 + Math.random() * 4.0);
        const mSpeed  = 0.02 + Math.random() * 0.04;
        const mTilt   = (Math.random() - 0.5) * 0.5;
        const mAngle  = Math.random() * Math.PI * 2;
        const mHue    = Math.random() * 0.08;
        const mType   = Math.random() < 0.3 ? 'black' : 'rock';
        const mColor  = mType === 'black' ? new THREE.Color(0.08, 0.08, 0.10)
                                          : new THREE.Color().setHSL(mHue, 0.35, 0.38);
        const { map: mm, normalMap: mn } = _makeRockyTex(mHue, Math.random() * 99999, mType);
        const moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(mr, 16, 16),
          new THREE.MeshPhongMaterial({ color: mColor, map: mm, normalMap: mn, shininess: mType === 'black' ? 4 : 5 })
        );
        scene.add(moonMesh);
        moons.push({ mesh: moonMesh, orbitR: mOrbitR, speed: mSpeed, tilt: mTilt, angle: mAngle });
      }
      // Doomed moon — close orbit, tidally shredded; particles stream from moon into ring
      let doomedMoon = null;
      if (Math.random() < 0.40) {
        const dmR      = 2 + Math.random() * 3;
        const dmOrbitR = r * (1.8 + Math.random() * 1.2);
        const dmSpeed  = 0.025 + Math.random() * 0.035;
        const dmTilt   = (Math.random() - 0.5) * 0.3;
        const dmAngle  = Math.random() * Math.PI * 2;
        const dmHue    = Math.random() * 0.08;
        const dmType   = Math.random() < 0.3 ? 'black' : 'rock';
        const dmColor  = dmType === 'black' ? new THREE.Color(0.08, 0.08, 0.10)
                                            : new THREE.Color().setHSL(dmHue, 0.35, 0.38);
        const { map: dm_map, normalMap: dm_nm } = _makeRockyTex(dmHue, Math.random() * 99999, dmType);
        const dmMesh = new THREE.Mesh(
          new THREE.SphereGeometry(dmR, 12, 12),
          new THREE.MeshPhongMaterial({ color: dmColor, map: dm_map, normalMap: dm_nm, shininess: 5 })
        );
        scene.add(dmMesh);
        // Orbital plane basis: u=(1,0,0), v=normalize(0, dmTilt, 1)
        const tNorm = Math.sqrt(1 + dmTilt * dmTilt);
        const RING_N   = 4000;
        const ringPos  = new Float32Array(RING_N * 3);
        const ringCol  = new Float32Array(RING_N * 3);
        const ringData = [];
        for (let ri = 0; ri < RING_N; ri++) {
          // Spread initial births around the orbit so no startup blob
          const bA = Math.random() * Math.PI * 2;
          ringData.push({
            birthX: Math.cos(bA) * dmOrbitR,
            birthY: Math.sin(bA) * dmOrbitR * dmTilt,
            birthZ: Math.sin(bA) * dmOrbitR,
            targetPa: Math.random() * Math.PI * 2,
            targetPr: dmOrbitR * (0.55 + Math.random() * 0.9),
            phase: Math.random(),                   // spread along trail from the start
            phaseSpeed: 0.0008 + Math.random() * 0.0012,
            drift: (0.0001 + Math.random() * 0.0003) * (Math.random() < 0.5 ? 1 : -1),
            waitTime: 0,
          });
          ringCol[ri * 3]     = dmColor.r;
          ringCol[ri * 3 + 1] = dmColor.g;
          ringCol[ri * 3 + 2] = dmColor.b;
        }
        const ringGeo = new THREE.BufferGeometry();
        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
        ringGeo.setAttribute('color',    new THREE.BufferAttribute(ringCol, 3));
        const ringPoints = new THREE.Points(ringGeo, new THREE.PointsMaterial({
          size: 2.0, vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false,
        }));
        ringPoints.frustumCulled = false;
        scene.add(ringPoints);
        doomedMoon = { mesh: dmMesh, orbitR: dmOrbitR, speed: dmSpeed, tilt: dmTilt, angle: dmAngle,
                       ringPoints, ringGeo, ringData, RING_N, tNorm };
      }
      moons._doomed = doomedMoon;
    } else {
      // Rocky planet — common; reds, greys, black, or water
      r = 10 + Math.random() * 22;
      orbitR = 300 + Math.random() * 1200;
      const roll = Math.random();
      let type, rockyHue, color, shininess;
      if (roll < 0.10) {
        type = 'black';
        rockyHue = 0;
        color = new THREE.Color(0.08, 0.08, 0.10);
        shininess = 4;
      } else if (roll < 0.25) {
        type = 'water';
        rockyHue = 0.6;
        color = new THREE.Color(0.05, 0.18, 0.55);
        shininess = 80;
      } else if (roll < 0.60) {
        type = 'ice';
        rockyHue = 0;
        color = new THREE.Color(0.82, 0.92, 0.98);
        shininess = 45;
      } else {
        type = 'rock';
        rockyHue = Math.random() < 0.6 ? Math.random() * 0.08 : 0.55 + Math.random() * 0.08;
        color = new THREE.Color().setHSL(rockyHue, rockyHue < 0.1 ? 0.45 : 0.10, 0.40);
        shininess = 5;
      }
      const { map, normalMap } = _makeRockyTex(rockyHue, Math.random() * 99999, type);
      mat = new THREE.MeshPhongMaterial({ color, map, normalMap, shininess });
    }
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 32), mat);
    scene.add(mesh);
    _solarPlanets.push({ mesh, r, orbitR, speed, tilt, zOff, angle, moons, doomedMoon: moons._doomed || null });
  }
}
_spawnPlanets();

function _tickSolar(dt) {
  for (const p of _solarPlanets) {
    if (!dayNightPaused) p.angle += p.speed * dt;
    const a = p.angle + _yearAngle;
    p.mesh.position.set(
      Math.cos(a) * p.orbitR,
      Math.sin(a) * p.orbitR,
      p.zOff + Math.sin(a) * p.orbitR * p.tilt
    );
    for (const m of (p.moons || [])) {
      if (!dayNightPaused) m.angle += m.speed * dt;
      const ma = m.angle + _yearAngle;
      m.mesh.position.set(
        p.mesh.position.x + Math.cos(ma) * m.orbitR,
        p.mesh.position.y + Math.sin(ma) * m.orbitR * m.tilt,
        p.mesh.position.z + Math.sin(ma) * m.orbitR
      );
    }
    if (p.doomedMoon) {
      const dm = p.doomedMoon;
      if (!dayNightPaused) dm.angle += dm.speed * dt;
      const dma = dm.angle + _yearAngle;
      // Moon's position relative to gas giant (in orbital plane)
      const moonRelX = Math.cos(dma) * dm.orbitR;
      const moonRelY = Math.sin(dma) * dm.orbitR * dm.tilt;
      const moonRelZ = Math.sin(dma) * dm.orbitR;
      dm.mesh.position.set(
        p.mesh.position.x + moonRelX,
        p.mesh.position.y + moonRelY,
        p.mesh.position.z + moonRelZ
      );
      // Update ring: each particle streams from moon to its ring orbit position, then recycles
      const rpos = dm.ringGeo.attributes.position.array;
      for (let ri = 0; ri < dm.RING_N; ri++) {
        const d = dm.ringData[ri];
        if (!dayNightPaused) {
          if (d.phase >= 1) {
            d.waitTime -= dt;
            if (d.waitTime <= 0) {
              d.birthX = moonRelX; d.birthY = moonRelY; d.birthZ = moonRelZ;
              d.targetPa = Math.random() * Math.PI * 2;
              d.phase = 0;
              d.waitTime = 0;
            }
            d.targetPa += d.drift * dt; // gentle ring drift while settled
          } else {
            d.phase += d.phaseSpeed * dt;
          }
        }
        const t = d.phase * d.phase * (3 - 2 * d.phase); // smoothstep
        // Target: ring position in moon's orbital plane (u=(1,0,0), v=normalize(0,tilt,1))
        const tx = Math.cos(d.targetPa) * d.targetPr;
        const ty = Math.sin(d.targetPa) * d.targetPr * dm.tilt / dm.tNorm;
        const tz = Math.sin(d.targetPa) * d.targetPr / dm.tNorm;
        rpos[ri * 3]     = p.mesh.position.x + d.birthX + (tx - d.birthX) * t;
        rpos[ri * 3 + 1] = p.mesh.position.y + d.birthY + (ty - d.birthY) * t;
        rpos[ri * 3 + 2] = p.mesh.position.z + d.birthZ + (tz - d.birthZ) * t;
      }
      dm.ringGeo.attributes.position.needsUpdate = true;
    }
  }
}

  _fcMoveDir.set(0, 0, 0);
  if (_fcKeys['KeyW'] || _fcKeys['ArrowUp'])    _fcMoveDir.addScaledVector(_fcFwd,   speed * dt);

// ── Traffic / Cars ─────────────────────────────────────────
let carsEnabled = true;
let trafficData = null;
let adjacency = {};   // ptKey -> [{segIdx, dir}]  dir: 1=forward, -1=backward
let carData = [];     // per-car state
const CAR_SPEED = 0.014; // OBJ units per second — base speed
const FOLLOW_SW   = 7;   // following detect distance in street-width units
const MIN_GAP_SW  = 1.5; // stop zone in street-width units (~1.25 car lengths)
const BRAKE_RATE  = 6;   // currentSpeed lerp rate when slowing
const ACCEL_RATE  = 2;   // currentSpeed lerp rate when speeding up
const ONCOMING_SW = 5;   // oncoming detect distance in street-width units
const CLEAR_SW    = 1.5; // lateral clear distance post-pass in street-width units
// pre-allocated temporaries — avoid per-frame GC
const _carFwd = new THREE.Vector3(), _carNorm = new THREE.Vector3(),
      _carRight = new THREE.Vector3(), _carUp = new THREE.Vector3(),
      _carM4 = new THREE.Matrix4(), _torM4 = new THREE.Matrix4();
const _segBuckets = new Map(); // reused each frame — O(N) neighbour scan

function ptKey(x, y, z, tol) {
  return `${Math.round(x/tol)},${Math.round(y/tol)},${Math.round(z/tol)}`;
}


function splitTrafficSegments(segs) {
  function xsect(ax, az, bx, bz, cx, cz, dx, dz) {
    const d1x=bx-ax, d1z=bz-az, d2x=dx-cx, d2z=dz-cz;
    const cross=d1x*d2z - d1z*d2x;
    if (Math.abs(cross) < 1e-10) return null;
    const ex=cx-ax, ez=cz-az;
    const t=(ex*d2z - ez*d2x)/cross, u=(ex*d1z - ez*d1x)/cross;
    const eps=1e-6;
    return (t>eps && t<1-eps && u>eps && u<1-eps) ? {t, u} : null;
  }
  const n=segs.length, tBuf=Array.from({length:n}, ()=>[]);
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) {
    const si=segs[i], sj=segs[j];
    const h=xsect(si.start[0],si.start[2],si.end[0],si.end[2],
                  sj.start[0],sj.start[2],sj.end[0],sj.end[2]);
    if (h) { tBuf[i].push(h.t); tBuf[j].push(h.u); }
  }
  const out=[];
  for (let i=0;i<n;i++) {
    const seg=segs[i], ts=tBuf[i];
    if (!ts.length) { out.push(seg); continue; }
    ts.sort((a,b)=>a-b);
    let prevT=0, prevPt=seg.start;
    for (const t of ts) {
      if (t-prevT<1e-6) continue;
      const pt=[seg.start[0]+(seg.end[0]-seg.start[0])*t,
                seg.start[1]+(seg.end[1]-seg.start[1])*t,
                seg.start[2]+(seg.end[2]-seg.start[2])*t];
      out.push({start:prevPt, end:pt, type:seg.type});
      prevPt=pt; prevT=t;
    }
    if (1-prevT>1e-6) out.push({start:prevPt, end:seg.end, type:seg.type});
  }
  return out;
}

function buildAdjacency(data) {
  adjacency = {};
  data.segments = splitTrafficSegments(data.segments);
  const tol = data.street_width * 0.1;
  const segs = data.segments;
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    const ss = seg.start, se = seg.end;
    const sk = ptKey(ss[0], ss[1], ss[2], tol);
    const ek = ptKey(se[0], se[1], se[2], tol);
    seg._sk = sk; seg._ek = ek;
    seg._len = Math.hypot(se[0]-ss[0], se[1]-ss[1], se[2]-ss[2]);
    const sw = data.street_width, len = seg._len || 1e-6;
    if (!adjacency[sk]) adjacency[sk] = [];
    if (!adjacency[ek]) adjacency[ek] = [];
    adjacency[sk].push({ segIdx: i, dir: 1 });
    adjacency[ek].push({ segIdx: i, dir: -1 });
  }
}

function nextSegment(curIdx, arrivedAtEnd) {
  const seg = trafficData.segments[curIdx];
  const key = arrivedAtEnd ? seg._ek : seg._sk;
  const opts = adjacency[key];
  if (!opts) return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };
  let count = 0;
  for (let i = 0; i < opts.length; i++) if (opts[i].segIdx !== curIdx) count++;
  if (!count) return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };

  // Streets: 30% chance to turn onto a boulevard when one is available at this junction
  if (seg.type === 'street' && count > 1) {
    const blvdCands = [];
    for (let i = 0; i < opts.length; i++)
      if (opts[i].segIdx !== curIdx && trafficData.segments[opts[i].segIdx].type === 'boulevard')
        blvdCands.push(opts[i]);
    if (blvdCands.length && Math.random() < 0.5)
      return blvdCands[Math.floor(Math.random() * blvdCands.length)];
  }

  // Boulevards: 75% chance to stay on boulevard rather than turning onto a street
  if (seg.type === 'boulevard' && count > 1) {
    const blvdCands = [];
    for (let i = 0; i < opts.length; i++)
      if (opts[i].segIdx !== curIdx && trafficData.segments[opts[i].segIdx].type === 'boulevard')
        blvdCands.push(opts[i]);
    if (blvdCands.length && Math.random() < 0.75)
      return blvdCands[Math.floor(Math.random() * blvdCands.length)];
  }

  // Streets: 80% bias toward continuing straight (highest dot product with current heading)
  if (seg.type === 'street' && count > 1 && Math.random() < 0.8) {
    const sd = arrivedAtEnd ? 1 : -1;
    const cdx = sd * (seg.end[0] - seg.start[0]);
    const cdz = sd * (seg.end[2] - seg.start[2]);
    const cl = Math.hypot(cdx, cdz) || 1;
    let bestDot = -Infinity, bestOpt = null;
    for (let i = 0; i < opts.length; i++) {
      const opt = opts[i];
      if (opt.segIdx === curIdx) continue;
      const ns = trafficData.segments[opt.segIdx];
      const ndx = opt.dir * (ns.end[0] - ns.start[0]);
      const ndz = opt.dir * (ns.end[2] - ns.start[2]);
      const dot = (cdx * ndx + cdz * ndz) / (cl * (Math.hypot(ndx, ndz) || 1));
      if (dot > bestDot) { bestDot = dot; bestOpt = opt; }
    }
    if (bestOpt && bestDot > 0.5) return bestOpt;
  }

  let pick = Math.floor(Math.random() * count);
  for (let i = 0; i < opts.length; i++) {
    if (opts[i].segIdx !== curIdx && pick-- === 0) return opts[i];
  }
  return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };
}

let carInstancedMesh = null;
const _carColor = new THREE.Color();

function spawnCars() {
  removeCars();
  if (!trafficData || !currentObj) return;
  const segs = trafficData.segments;
  if (!segs.length) return;

  const sw = trafficData.street_width;
  const carLen = sw * 1.2, carW = sw * 0.4, carH = sw * 0.5;
  const geo = new THREE.BoxGeometry(carW, carH, carLen);
