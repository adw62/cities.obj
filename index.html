<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>City OBJ Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 10;
      border-bottom: 1px solid #222;
    }

    #topbar h1 { font-size: 13px; color: #888; white-space: nowrap; }

    #model-select {
      background: #111;
      border: 1px solid #333;
      color: #eee;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      max-width: 240px;
    }

    .mode-btn {
      background: #111;
      border: 1px solid #333;
      color: #aaa;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:hover { background: #1e1e2e; color: #fff; }
    .mode-btn.active { background: #2a4a8a; color: #8af; border-color: #4a6aaa; }

    /* ── Side panel ── */
    #panel {
      position: fixed;
      top: 48px; right: 0;
      width: 200px;
      background: rgba(0,0,0,0.85);
      border-left: 1px solid #222;
      padding: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    .panel-section label {
      display: block;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #4a8af4;
    }

    input[type=color] {
      width: 100%;
      height: 24px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: none;
    }

    #music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    #music-title {
      font-size: 11px;
      color: #666;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: #444;
      z-index: 10;
    }

    #gen-panel {
      position: fixed;
      top: 48px; left: 0;
      width: 200px;
      background: rgba(0,0,0,0.85);
      border-right: 1px solid #222;
      padding: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    #gen-panel label {
      display: block;
      color: #666;
      margin-bottom: 3px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    #gen-panel input[type=number],
    #gen-panel select {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #eee;
      padding: 3px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
    }

    #gen-panel input[type=range] { width: 100%; accent-color: #4a8af4; }
    #gen-panel input[type=checkbox] { accent-color: #4a8af4; }

    #btn-generate {
      background: #2a4a8a;
      border: 1px solid #4a6aaa;
      color: #8af;
      padding: 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    #btn-generate:hover { background: #3a5aaa; }
    #btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-download {
      background: #1a3a1a;
      border: 1px solid #3a6a3a;
      color: #6f6;
      padding: 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      display: none;
    }
    #btn-download:hover { background: #2a4a2a; }

    #gen-status { color: #666; font-size: 10px; min-height: 14px; }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Generator panel -->
<div id="gen-panel">
  <div style="color:#aaa;font-size:12px;font-weight:bold;">Generate City</div>

  <div class="panel-section">
    <label>Seed</label>
    <input type="number" id="gen-seed" value="7" min="0" max="999999">
  </div>

  <div class="panel-section">
    <label>Width (m) <span id="gen-width-val">400</span></label>
    <input type="range" id="gen-width" min="100" max="1200" step="50" value="400">
  </div>
  <div class="panel-section">
    <label>Depth (m) <span id="gen-depth-val">400</span></label>
    <input type="range" id="gen-depth" min="100" max="1200" step="50" value="400">
  </div>

  <div class="panel-section">
    <label>Block Size (m) <span id="gen-block-val">40</span></label>
    <input type="range" id="gen-block" min="20" max="120" step="5" value="40">
  </div>
  <div class="panel-section">
    <label>Street Width (m) <span id="gen-street-val">8</span></label>
    <input type="range" id="gen-street" min="4" max="24" step="1" value="8">
  </div>

  <div class="panel-section">
    <label>Max Floors <span id="gen-floors-val">18</span></label>
    <input type="range" id="gen-floors" min="2" max="60" step="1" value="18">
  </div>

  <div class="panel-section">
    <label>Distribution</label>
    <select id="gen-dist">
      <option value="gumbel">Gumbel (skewed)</option>
      <option value="uniform">Uniform</option>
      <option value="normal">Normal</option>
    </select>
  </div>

  <div class="panel-section">
    <label>Highways <span id="gen-hw-val">1</span></label>
    <input type="range" id="gen-hw" min="0" max="4" step="1" value="1">
  </div>

  <div class="panel-section" id="gen-vsites-row" style="display:none;">
    <label>Voronoi Sites <span id="gen-vsites-val">8</span></label>
    <input type="range" id="gen-vsites" min="3" max="24" step="1" value="8">
  </div>

  <div class="panel-section">
    <label>Surface</label>
    <select id="gen-surface">
      <option value="flat">Flat</option>
      <option value="sphere">Sphere</option>
      <option value="hemisphere">Hemisphere</option>
      <option value="torus">Torus</option>
    </select>
  </div>
  <div id="gen-sphere-row" class="panel-section" style="display:none;">
    <label>Radius (m) <span id="gen-sradius-val">200</span></label>
    <input type="range" id="gen-sradius" min="50" max="600" step="10" value="200">
  </div>
  <div id="gen-torus-major-row" class="panel-section" style="display:none;">
    <label>Major Radius (m) <span id="gen-tmajor-val">600</span></label>
    <input type="range" id="gen-tmajor" min="100" max="1200" step="50" value="600">
  </div>
  <div id="gen-torus-minor-row" class="panel-section" style="display:none;">
    <label>Minor Radius (m) <span id="gen-tminor-val">120</span></label>
    <input type="range" id="gen-tminor" min="30" max="400" step="10" value="120">
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;margin-top:2px;">
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-voronoi"> Voronoi boulevards</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-diagonal"> Diagonal road</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-windows" checked> Windows</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-base" checked> Base plate</label>
  </div>

  <button id="btn-generate">Generate</button>
  <button id="btn-download">Download OBJ</button>
  <div id="gen-status"></div>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>City Viewer</h1>
  <select id="model-select"></select>

  <button class="mode-btn active" data-mode="orbit">Orbit</button>
  <button class="mode-btn" data-mode="daynight">Day/Night</button>
  <button class="mode-btn" data-mode="rain">Rain</button>
  <button class="mode-btn" data-mode="wireframe">Wireframe</button>

  <div id="music-controls">
    <button class="mode-btn" id="music-prev">&#9664;&#9664;</button>
    <button class="mode-btn" id="music-play">&#9654;</button>
    <button class="mode-btn" id="music-next">&#9654;&#9654;</button>
    <span id="music-title">—</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" style="width:70px;accent-color:#4a8af4;cursor:pointer;">
  </div>
</div>

<!-- Side panel -->
<div id="panel">
  <div class="panel-section">
    <label>Model Color</label>
    <input type="color" id="color-pick" value="#4488cc">
  </div>
  <div class="panel-section">
    <label>Rotation Speed</label>
    <input type="range" id="speed-slider" min="0" max="0.05" step="0.001" value="0.0015">
  </div>
  <div class="panel-section">
    <label>Ambient Light</label>
    <input type="range" id="ambient-slider" min="0" max="2" step="0.05" value="0.5">
  </div>
  <div class="panel-section">
    <label>Wire Opacity</label>
    <input type="range" id="wire-opacity" min="0.05" max="1" step="0.05" value="0.15">
  </div>
  <div class="panel-section">
    <label>Traffic</label>
    <button class="mode-btn active" id="btn-cars" style="width:100%;margin-bottom:4px">Cars: ON</button>
    <label>Car Count</label>
    <input type="range" id="car-count" min="5" max="200" step="5" value="40">
    <span id="car-count-val">40</span>
  </div>
</div>

<div id="status">Loading…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ── Scene / Camera ────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 200, 600);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 60, 120);

// ── Lights ────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4cc, 1.2);
sun.position.set(100, 150, 80);
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-80, 20, -60);
scene.add(fillLight);


// ── Controls ──────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;

// ── State ─────────────────────────────────────────────────
let currentObj = null;
let rainSystem = null;
let mode = 'orbit';
let modelColor = new THREE.Color(0x4488cc);
let rotSpeed = 0.0015;
controls.autoRotateSpeed = rotSpeed * 300;
let autoScale = 1;
let modelCenter = new THREE.Vector3();
let clock = new THREE.Clock();
const status = document.getElementById('status');

// ── Traffic / Cars ─────────────────────────────────────────
let carsEnabled = true;
let trafficData = null;
let adjacency = {};   // ptKey -> [{segIdx, dir}]  dir: 1=forward, -1=backward
let carData = [];     // per-car state
const CAR_SPEED = 0.02; // OBJ units per second
// pre-allocated temporaries to avoid per-frame GC pressure
const _carFwd = new THREE.Vector3(), _carNorm = new THREE.Vector3(),
      _carRight = new THREE.Vector3(), _carUp = new THREE.Vector3(),
      _carM4 = new THREE.Matrix4();

function ptKey(x, y, z, tol) {
  return `${Math.round(x/tol)},${Math.round(y/tol)},${Math.round(z/tol)}`;
}

function loadTrafficJSON(modelPath) {
  removeCars();
  trafficData = null;
  adjacency = {};
  const jsonPath = modelPath.replace('.obj', '_traffic.json');
  fetch(jsonPath)
    .then(r => { if (!r.ok) throw new Error('no traffic json'); return r.json(); })
    .then(data => {
      trafficData = data;
      buildAdjacency(data);
      if (carsEnabled && currentObj) spawnCars();
    })
    .catch(() => {});
}

function buildAdjacency(data) {
  adjacency = {};
  const tol = data.street_width * 0.1;
  data.segments.forEach((seg, i) => {
    const sk = ptKey(seg.start[0], seg.start[1], seg.start[2], tol);
    const ek = ptKey(seg.end[0], seg.end[1], seg.end[2], tol);
    if (!adjacency[sk]) adjacency[sk] = [];
    if (!adjacency[ek]) adjacency[ek] = [];
    adjacency[sk].push({ segIdx: i, dir: 1 });   // leave start going forward
    adjacency[ek].push({ segIdx: i, dir: -1 });  // leave end going backward
  });
}

function segEndpoint(seg, atEnd) {
  return atEnd ? seg.end : seg.start;
}

function nextSegment(curIdx, arrivedAtEnd) {
  const seg = trafficData.segments[curIdx];
  const pt = segEndpoint(seg, arrivedAtEnd);
  const tol = trafficData.street_width * 0.1;
  const key = ptKey(pt[0], pt[1], pt[2], tol);
  const options = (adjacency[key] || []).filter(o => o.segIdx !== curIdx);
  if (!options.length) return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 }; // U-turn
  return options[Math.floor(Math.random() * options.length)];
}

function spawnCars() {
  removeCars();
  if (!trafficData || !currentObj) return;
  const segs = trafficData.segments;
  if (!segs.length) return;

  const sw = trafficData.street_width;
  const carLen = sw * 1.2, carW = sw * 0.4, carH = sw * 0.5;
  const geo = new THREE.BoxGeometry(carW, carH, carLen);
  const count = parseInt(document.getElementById('car-count').value);

  for (let i = 0; i < count; i++) {
    const segIdx = Math.floor(Math.random() * segs.length);
    const dir = Math.random() < 0.5 ? 1 : -1;
    const t = Math.random();
    const color = new THREE.Color().setHSL(Math.random(), 0.9, 0.55);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color }));
    mesh.userData.isCar = true;
    currentObj.add(mesh);
    carData.push({ mesh, segIdx, dir, t });
  }
  updateCarPositions();
}

function removeCars() {
  carData.forEach(c => {
    if (c.mesh.parent) c.mesh.parent.remove(c.mesh);
    c.mesh.geometry.dispose();
    c.mesh.material.dispose();
  });
  carData = [];
}

function updateCarPositions() {
  if (!trafficData) return;
  const surf = trafficData.surface || 'flat';
  const lift = trafficData.street_width * 0.25;
  carData.forEach(car => {
    const seg = trafficData.segments[car.segIdx];
    const s = car.dir === 1 ? seg.start : seg.end;
    const e = car.dir === 1 ? seg.end : seg.start;
    const x = s[0] + (e[0] - s[0]) * car.t;
    const y = s[1] + (e[1] - s[1]) * car.t;
    const z = s[2] + (e[2] - s[2]) * car.t;
    const dx = e[0] - s[0], dy = e[1] - s[1], dz = e[2] - s[2];

    if (surf !== 'flat' && (dx || dy || dz)) {
      // surface normal at this point
      if (surf === 'sphere' || surf === 'hemisphere') {
        _carNorm.set(x, y, z).normalize();
      } else { // torus
        const major = trafficData.torus_major_sc || 0;
        const xzl = Math.hypot(x, z) || 1e-9;
        _carNorm.set(x - x/xzl*major, y, z - z/xzl*major).normalize();
      }
      // lift along surface normal
      car.mesh.position.set(
        x + _carNorm.x * lift,
        y + _carNorm.y * lift,
        z + _carNorm.z * lift
      );
      // orient: Z=forward along road, Y=surface normal, X=right
      // right-handed basis requires: right = norm × fwd, up = fwd × right
      _carFwd.set(dx, dy, dz).normalize();
      _carRight.crossVectors(_carNorm, _carFwd).normalize();
      _carUp.crossVectors(_carFwd, _carRight);
      _carM4.makeBasis(_carRight, _carUp, _carFwd);
      car.mesh.quaternion.setFromRotationMatrix(_carM4);
    } else {
      car.mesh.position.set(x, y + lift, z);
      car.mesh.rotation.set(0, Math.atan2(dx, dz), 0);
    }
  });
}

function updateCars(dt) {
  if (!trafficData) return;
  carData.forEach(car => {
    const seg = trafficData.segments[car.segIdx];
    const s = seg.start, e = seg.end;
    const segLen = Math.hypot(e[0]-s[0], e[1]-s[1], e[2]-s[2]);
    const step = segLen > 0 ? (CAR_SPEED * dt) / segLen : 0;
    car.t += step;
    if (car.t >= 1) {
      const arrivedAtEnd = car.dir === 1;
      const next = nextSegment(car.segIdx, arrivedAtEnd);
      car.segIdx = next.segIdx;
      car.dir = next.dir;
      car.t = 0;
    }
  });
  updateCarPositions();
}

// ── OBJ Loader ────────────────────────────────────────────
const loader = new OBJLoader();

function loadModel(path) {
  status.textContent = `Loading ${path.split('/').pop()}…`;

  if (currentObj) {
    scene.remove(currentObj);
    currentObj.traverse(c => { if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); } });
    currentObj = null;
  }
  removeRain();

  loader.load(path, (obj) => {
    // Auto-center and scale to fit
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetSize = 80;
    autoScale = targetSize / maxDim;
    modelCenter.copy(center);

    const sliderVal = 1;
    obj.scale.setScalar(autoScale * sliderVal);
    obj.position.copy(modelCenter).multiplyScalar(-(autoScale * sliderVal));

    applyMaterial(obj);
    scene.add(obj);
    currentObj = obj;

    if (mode === 'rain') buildRain();
    loadTrafficJSON(path);

    status.textContent = `${path.split('/').pop()} — ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} units`;
  }, undefined, (err) => {
    status.textContent = `Error loading: ${path}`;
    console.error(err);
  });
}

function applyMaterial(obj) {
  const isWire = mode === 'wireframe';
  const opacity = parseFloat(document.getElementById('wire-opacity').value);
  obj.traverse(c => {
    if (!c.isMesh || c.userData.isCar) return;
    c.material = isWire
      ? new THREE.MeshBasicMaterial({ color: modelColor, wireframe: true, transparent: true, opacity })
      : new THREE.MeshStandardMaterial({ color: modelColor, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide });
  });
}


// ── Rain ──────────────────────────────────────────────────
function buildRain() {
  if (rainSystem) scene.remove(rainSystem);
  const count = 8000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 250;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainSystem = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.3, transparent: true, opacity: 0.6 }));
  scene.add(rainSystem);
}

function removeRain() {
  if (rainSystem) { scene.remove(rainSystem); rainSystem = null; }
}

function updateRain() {
  if (!rainSystem) return;
  const pos = rainSystem.geometry.attributes.position;
  for (let i = 1; i < pos.count * 3; i += 3) {
    pos.array[i] -= 0.8;
    if (pos.array[i] < -80) pos.array[i] = 120;
  }
  pos.needsUpdate = true;
}

// ── Animation loop ────────────────────────────────────────
let flyT = 0;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();

  if (currentObj) {
    if (mode === 'daynight') {
      flyT += 0.008;
      const sunY = Math.sin(flyT);
      sun.position.set(Math.cos(flyT) * 200, sunY * 200, 60);
      const t = Math.max(0, sunY);
      const night = 1 - t;
      renderer.setClearColor(new THREE.Color(night * 0.04, night * 0.04, night * 0.08 + t * 0.4));
      scene.background = new THREE.Color(night * 0.04, night * 0.04, night * 0.08 + t * 0.4);
      ambient.intensity = 0.1 + t * 0.9;
      sun.color.setRGB(1, 0.6 + t * 0.4, 0.3 + t * 0.7);
    }

    if (mode === 'rain') {
      currentObj.rotation.y += rotSpeed * 0.3;
      updateRain();
    }
  }

  controls.update();

  if (carsEnabled) updateCars(dt);
  renderer.render(scene, camera);
});

// ── UI events ─────────────────────────────────────────────
document.querySelectorAll('#topbar [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#topbar [data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;

    controls.autoRotate = (mode === 'orbit' || mode === 'wireframe');

    if (mode === 'rain') buildRain();
    else removeRain();

    if (mode === 'daynight') {
      flyT = 0;
    } else {
      scene.background = new THREE.Color(0x0a0a12);
      renderer.setClearColor(0x0a0a12);
      ambient.intensity = parseFloat(document.getElementById('ambient-slider').value);
      sun.color.set(0xfff4cc);
    }

    if (currentObj) applyMaterial(currentObj);
  });
});

document.getElementById('model-select').addEventListener('change', e => {
  loadModel(e.target.value);
});

document.getElementById('color-pick').addEventListener('input', e => {
  modelColor = new THREE.Color(e.target.value);
  if (currentObj) applyMaterial(currentObj);
});


document.getElementById('speed-slider').addEventListener('input', e => {
  rotSpeed = parseFloat(e.target.value);
  controls.autoRotateSpeed = rotSpeed * 300;
});

document.getElementById('ambient-slider').addEventListener('input', e => {
  ambient.intensity = parseFloat(e.target.value);
});

document.getElementById('wire-opacity').addEventListener('input', e => {
  if (currentObj && mode === 'wireframe') applyMaterial(currentObj);
});


document.getElementById('btn-cars').addEventListener('click', () => {
  carsEnabled = !carsEnabled;
  document.getElementById('btn-cars').textContent = `Cars: ${carsEnabled ? 'ON' : 'OFF'}`;
  document.getElementById('btn-cars').classList.toggle('active', carsEnabled);
  if (carsEnabled) spawnCars();
  else removeCars();
});

document.getElementById('car-count').addEventListener('input', e => {
  document.getElementById('car-count-val').textContent = e.target.value;
  if (carsEnabled) spawnCars();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Initial load ──────────────────────────────────────────
fetch('output/manifest.json')
  .then(r => r.json())
  .then(files => {
    const sel = document.getElementById('model-select');
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = `output/${f}`;
      opt.textContent = f.replace('.obj', '');
      sel.appendChild(opt);
    });
    if (files.length) loadModel(`output/${files[0]}`);
  })
  .catch(() => { status.textContent = 'Error: could not load output/manifest.json'; });

// ── Music ─────────────────────────────────────────────────
const audio = new Audio();
audio.volume = 0.5;
let tracks = [];
let trackIdx = 0;

function playTrack(i) {
  if (!tracks.length) return;
  trackIdx = (i + tracks.length) % tracks.length;
  audio.src = `music/${tracks[trackIdx]}`;
  audio.play();
  document.getElementById('music-title').textContent = tracks[trackIdx].replace(/\.[^.]+$/, '');
  document.getElementById('music-play').textContent = '⏸';
}

audio.addEventListener('ended', () => playTrack(trackIdx + 1));

document.getElementById('music-play').addEventListener('click', () => {
  if (!tracks.length) return;
  if (audio.paused) {
    if (!audio.src || audio.src === window.location.href) playTrack(0);
    else audio.play();
    document.getElementById('music-play').textContent = '⏸';
  } else {
    audio.pause();
    document.getElementById('music-play').textContent = '▶';
  }
});

document.getElementById('music-prev').addEventListener('click', () => playTrack(trackIdx - 1));
document.getElementById('music-next').addEventListener('click', () => playTrack(trackIdx + 1));
document.getElementById('volume-slider').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });

fetch('music/manifest.json')
  .then(r => r.json())
  .then(files => {
    tracks = files;
    files.forEach(f => { const a = new Audio(`music/${f}`); a.preload = 'auto'; });
  });

// ── Generator ─────────────────────────────────────────────
let genWorker = null;
let lastObjText = null;

const genSliders = [
  ['gen-width',   'gen-width-val'],
  ['gen-depth',   'gen-depth-val'],
  ['gen-block',   'gen-block-val'],
  ['gen-street',  'gen-street-val'],
  ['gen-floors',  'gen-floors-val'],
  ['gen-hw',      'gen-hw-val'],
  ['gen-vsites',  'gen-vsites-val'],
  ['gen-sradius', 'gen-sradius-val'],
  ['gen-tmajor',  'gen-tmajor-val'],
  ['gen-tminor',  'gen-tminor-val'],
];
genSliders.forEach(([id, valId]) => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById(valId).textContent = e.target.value;
  });
});

document.getElementById('gen-voronoi').addEventListener('change', e => {
  document.getElementById('gen-vsites-row').style.display = e.target.checked ? 'block' : 'none';
});

document.getElementById('gen-surface').addEventListener('change', e => {
  const s = e.target.value;
  document.getElementById('gen-sphere-row').style.display     = (s === 'sphere' || s === 'hemisphere') ? 'block' : 'none';
  document.getElementById('gen-torus-major-row').style.display = s === 'torus' ? 'block' : 'none';
  document.getElementById('gen-torus-minor-row').style.display = s === 'torus' ? 'block' : 'none';
});

document.getElementById('btn-generate').addEventListener('click', () => {
  if (genWorker) genWorker.terminate();
  genWorker = new Worker('./generator.js?v=' + Date.now(), { type: 'module' });

  const btn = document.getElementById('btn-generate');
  const genStatus = document.getElementById('gen-status');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  genStatus.textContent = 'Building city…';
  document.getElementById('btn-download').style.display = 'none';

  const config = {
    seed:              parseInt(document.getElementById('gen-seed').value),
    city_width:        parseInt(document.getElementById('gen-width').value),
    city_depth:        parseInt(document.getElementById('gen-depth').value),
    block_width:       parseInt(document.getElementById('gen-block').value),
    block_depth:       parseInt(document.getElementById('gen-block').value),
    street_width:      parseInt(document.getElementById('gen-street').value),
    max_floors:        parseInt(document.getElementById('gen-floors').value),
    dist:              document.getElementById('gen-dist').value,
    num_highways:      parseInt(document.getElementById('gen-hw').value),
    voronoi_boulevards:document.getElementById('gen-voronoi').checked,
    voronoi_sites:     parseInt(document.getElementById('gen-vsites').value),
    diagonal_road:     document.getElementById('gen-diagonal').checked,

    window_min_floors: document.getElementById('gen-windows').checked ? 4 : 999,
    add_base:          document.getElementById('gen-base').checked,
    surface:           document.getElementById('gen-surface').value,
    sphere_radius:     parseInt(document.getElementById('gen-sradius').value),
    torus_major:       parseInt(document.getElementById('gen-tmajor').value),
    torus_minor:       parseInt(document.getElementById('gen-tminor').value),
  };

  genWorker.onmessage = e => {
    btn.disabled = false;
    btn.textContent = 'Generate';
    if (!e.data.ok) {
      genStatus.textContent = 'Error: ' + e.data.error;
      console.error(e.data.error);
      return;
    }

    const { objects, surface: genSurface, traffic } = e.data;
    genStatus.textContent = `${genSurface ?? 'flat'} — ${objects.length} objects`;

    // Build Three.js group from typed arrays
    if (currentObj) {
      removeCars();
      scene.remove(currentObj);
      currentObj.traverse(c => { if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); } });
    }

    const group = new THREE.Group();
    for (const { verts, faces } of objects) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geo.setIndex(new THREE.BufferAttribute(faces, 1));
      const flat = geo.toNonIndexed();
      flat.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ color: modelColor, metalness: 0.2, roughness: 0.7, side: THREE.DoubleSide });
      group.add(new THREE.Mesh(flat, mat));
    }

    // Auto-centre and scale
    const box3 = new THREE.Box3().setFromObject(group);
    const size3 = box3.getSize(new THREE.Vector3());
    const center3 = box3.getCenter(new THREE.Vector3());
    autoScale = 80 / Math.max(size3.x, size3.y, size3.z);
    modelCenter.copy(center3);
    group.scale.setScalar(autoScale);
    group.position.copy(center3).multiplyScalar(-autoScale);

    scene.add(group);
    currentObj = group;
    trafficData = null; adjacency = {};
    buildAdjacency(traffic); trafficData = traffic;
    if (carsEnabled) spawnCars();
    status.textContent = `Generated — ${objects.length} objects`;

    // Build OBJ for download
    lastObjText = buildObjText(objects, config.seed);
    document.getElementById('btn-download').style.display = 'block';
  };

  genWorker.postMessage(config);
});

document.getElementById('btn-download').addEventListener('click', () => {
  if (!lastObjText) return;
  const blob = new Blob([lastObjText], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `city_seed${document.getElementById('gen-seed').value}.obj`;
  a.click();
  URL.revokeObjectURL(a.href);
});

function buildObjText(objects, seed) {
  const lines = [`# Generated by procity (seed ${seed})`];
  let offset = 1;
  for (const { name, verts, faces } of objects) {
    lines.push(`o ${name}`);
    for (let i = 0; i < verts.length; i += 3)
      lines.push(`v ${verts[i].toFixed(6)} ${verts[i+1].toFixed(6)} ${verts[i+2].toFixed(6)}`);
    for (let i = 0; i < faces.length; i += 3)
      lines.push(`f ${faces[i]+offset} ${faces[i+1]+offset} ${faces[i+2]+offset}`);
    offset += verts.length / 3;
  }
  return lines.join('\n');
}
</script>
