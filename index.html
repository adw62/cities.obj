<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>City OBJ Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── Top bar ── */
    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 10;
      border-bottom: 1px solid #222;
    }

    #topbar h1 { font-size: 13px; color: #888; white-space: nowrap; }

    #model-select {
      background: #111;
      border: 1px solid #333;
      color: #eee;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      max-width: 240px;
    }

    .mode-btn {
      background: #111;
      border: 1px solid #333;
      color: #aaa;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn:hover { background: #1e1e2e; color: #fff; }
    .mode-btn.active { background: #2a4a8a; color: #8af; border-color: #4a6aaa; }

    /* ── Side panel ── */
    #panel {
      position: fixed;
      top: 48px; right: 0;
      width: 200px;
      background: rgba(0,0,0,0.85);
      border-left: 1px solid #222;
      padding: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    .panel-section label {
      display: block;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    input[type=range] {
      width: 100%;
      accent-color: #4a8af4;
    }

    input[type=color] {
      width: 100%;
      height: 24px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: none;
    }

    #music-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    #music-title {
      font-size: 11px;
      color: #666;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: #444;
      z-index: 10;
    }

    #gen-panel {
      position: fixed;
      top: 48px; left: 0;
      width: 200px;
      background: rgba(0,0,0,0.85);
      border-right: 1px solid #222;
      padding: 12px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    #gen-panel label {
      display: block;
      color: #666;
      margin-bottom: 3px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
    }

    #gen-panel input[type=number],
    #gen-panel select {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #eee;
      padding: 3px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
    }

    #gen-panel input[type=range] { width: 100%; accent-color: #4a8af4; }
    #gen-panel input[type=checkbox] { accent-color: #4a8af4; }

    #btn-generate {
      background: #2a4a8a;
      border: 1px solid #4a6aaa;
      color: #8af;
      padding: 7px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }
    #btn-generate:hover { background: #3a5aaa; }
    #btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }

    #btn-download {
      background: #1a3a1a;
      border: 1px solid #3a6a3a;
      color: #6f6;
      padding: 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      display: none;
    }
    #btn-download:hover { background: #2a4a2a; }

    #gen-status { color: #666; font-size: 10px; min-height: 14px; }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Generator panel -->
<div id="gen-panel">
  <div style="color:#aaa;font-size:12px;font-weight:bold;">Generate City</div>

  <div class="panel-section">
    <label>Seed</label>
    <input type="number" id="gen-seed" value="7" min="0" max="999999">
  </div>

  <div class="panel-section">
    <label>Width (m) <span id="gen-width-val">400</span></label>
    <input type="range" id="gen-width" min="100" max="1200" step="50" value="400">
  </div>
  <div class="panel-section">
    <label>Depth (m) <span id="gen-depth-val">400</span></label>
    <input type="range" id="gen-depth" min="100" max="1200" step="50" value="400">
  </div>

  <div class="panel-section">
    <label>Block Size (m) <span id="gen-block-val">40</span></label>
    <input type="range" id="gen-block" min="20" max="120" step="5" value="40">
  </div>
  <div class="panel-section">
    <label>Street Width (m) <span id="gen-street-val">8</span></label>
    <input type="range" id="gen-street" min="4" max="24" step="1" value="8">
  </div>

  <div class="panel-section">
    <label>Max Floors <span id="gen-floors-val">18</span></label>
    <input type="range" id="gen-floors" min="2" max="60" step="1" value="18">
  </div>

  <div class="panel-section">
    <label>Distribution</label>
    <select id="gen-dist">
      <option value="gumbel">Gumbel (skewed)</option>
      <option value="uniform">Uniform</option>
      <option value="normal">Normal</option>
    </select>
  </div>

  <div class="panel-section">
    <label>Highways <span id="gen-hw-val">1</span></label>
    <input type="range" id="gen-hw" min="0" max="4" step="1" value="1">
  </div>

  <div class="panel-section" id="gen-vsites-row" style="display:none;">
    <label>Voronoi Sites <span id="gen-vsites-val">8</span></label>
    <input type="range" id="gen-vsites" min="3" max="24" step="1" value="8">
  </div>

  <div class="panel-section">
    <label>Surface</label>
    <select id="gen-surface">
      <option value="flat">Flat</option>
      <option value="sphere">Sphere</option>
      <option value="hemisphere">Hemisphere</option>
      <option value="torus">Torus</option>
    </select>
  </div>
  <div id="gen-sphere-row" class="panel-section" style="display:none;">
    <label>Radius (m) <span id="gen-sradius-val">200</span></label>
    <input type="range" id="gen-sradius" min="50" max="600" step="10" value="200">
  </div>
  <div id="gen-torus-major-row" class="panel-section" style="display:none;">
    <label>Major Radius (m) <span id="gen-tmajor-val">600</span></label>
    <input type="range" id="gen-tmajor" min="100" max="1200" step="50" value="600">
  </div>
  <div id="gen-torus-minor-row" class="panel-section" style="display:none;">
    <label>Minor Radius (m) <span id="gen-tminor-val">120</span></label>
    <input type="range" id="gen-tminor" min="30" max="400" step="10" value="120">
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;margin-top:2px;">
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-voronoi"> Voronoi boulevards</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-diagonal"> Diagonal road</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-windows" checked> Windows</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;">
      <input type="checkbox" id="gen-base" checked> Base plate</label>
  </div>

  <button id="btn-generate">Generate</button>
  <button id="btn-download">Download OBJ</button>
  <div id="gen-status"></div>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>City Viewer</h1>
  <select id="model-select"></select>

  <button class="mode-btn active" data-mode="orbit">Orbit</button>
  <button class="mode-btn" data-mode="daynight">Day/Night</button>
  <button class="mode-btn" data-mode="rain">Rain</button>
  <button class="mode-btn" data-mode="wireframe">Wireframe</button>

  <div id="music-controls">
    <button class="mode-btn" id="music-prev">&#9664;&#9664;</button>
    <button class="mode-btn" id="music-play">&#9654;</button>
    <button class="mode-btn" id="music-next">&#9654;&#9654;</button>
    <span id="music-title">—</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" style="width:70px;accent-color:#4a8af4;cursor:pointer;">
  </div>
</div>

<!-- Side panel -->
<div id="panel">
  <div class="panel-section">
    <label>Base Color</label>
    <input type="color" id="color-base" value="#1a1a2e">
  </div>
  <div class="panel-section">
    <label>Building Color</label>
    <input type="color" id="color-pick" value="#4488cc">
  </div>
  <div class="panel-section">
    <label>Road Color</label>
    <input type="color" id="color-road" value="#334455">
  </div>
  <div class="panel-section">
    <label>Depth Fog</label>
    <label style="display:flex;gap:8px;align-items:center;text-transform:none;color:#aaa;font-size:11px;margin-bottom:4px">
      <input type="checkbox" id="fog-toggle"> Enable
    </label>
    <input type="range" id="fog-density" min="0.002" max="0.06" step="0.001" value="0.015">
  </div>
  <div class="panel-section">
    <label>Rotation Speed</label>
    <input type="range" id="speed-slider" min="0" max="0.05" step="0.001" value="0.0015">
  </div>
  <div class="panel-section">
    <label>Ambient Light</label>
    <input type="range" id="ambient-slider" min="0" max="2" step="0.05" value="0.5">
  </div>
  <div class="panel-section">
    <label>Wire Opacity</label>
    <input type="range" id="wire-opacity" min="0.05" max="1" step="0.05" value="0.15">
  </div>
  <div class="panel-section">
    <label>Traffic</label>
    <button class="mode-btn active" id="btn-cars" style="width:100%;margin-bottom:4px">Cars: ON</button>
    <label>Car Count</label>
    <input type="range" id="car-count" min="5" max="200" step="5" value="40">
    <span id="car-count-val">40</span>
  </div>
</div>

<div id="status">Loading…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ── Renderer ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = false;
document.getElementById('canvas-container').appendChild(renderer.domElement);

// ── Scene / Camera ────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 60, 120);

// ── Lights ────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff4cc, 1.2);
sun.position.set(100, 150, 80);
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-80, 20, -60);
scene.add(fillLight);


// ── Controls ──────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;

// ── State ─────────────────────────────────────────────────
let currentObj = null;
let rainSystem = null;
let mode = 'orbit';
let modelColor = new THREE.Color(0x4488cc);
let baseColor  = new THREE.Color(0x1a1a2e);
let roadColor  = new THREE.Color(0x334455);
let fogEnabled = false;
let fogDensity = 0.015;
let rotSpeed = 0.0015;

controls.autoRotateSpeed = rotSpeed * 300;

function colorKey(name) {
  if (name === 'base_plate') return 'base';
  if (name && (name.startsWith('boulevard') || name.startsWith('highway'))) return 'road';
  return 'building';
}
function colorFor(key) {
  return key === 'base' ? baseColor : key === 'road' ? roadColor : modelColor;
}
let autoScale = 1;
let modelCenter = new THREE.Vector3();
let clock = new THREE.Clock();
const _bgColor = new THREE.Color(); // reused each frame in day/night mode
const status = document.getElementById('status');

// ── Traffic / Cars ─────────────────────────────────────────
let carsEnabled = true;
let trafficData = null;
let adjacency = {};   // ptKey -> [{segIdx, dir}]  dir: 1=forward, -1=backward
let carData = [];     // per-car state
const CAR_SPEED = 0.014; // OBJ units per second — base speed
const FOLLOW_SW   = 7;   // following detect distance in street-width units
const MIN_GAP_SW  = 1.5; // stop zone in street-width units (~1.25 car lengths)
const BRAKE_RATE  = 6;   // currentSpeed lerp rate when slowing
const ACCEL_RATE  = 2;   // currentSpeed lerp rate when speeding up
const ONCOMING_SW = 5;   // oncoming detect distance in street-width units
const CLEAR_SW    = 1.5; // lateral clear distance post-pass in street-width units
// pre-allocated temporaries — avoid per-frame GC
const _carFwd = new THREE.Vector3(), _carNorm = new THREE.Vector3(),
      _carRight = new THREE.Vector3(), _carUp = new THREE.Vector3(),
      _carM4 = new THREE.Matrix4();
const _segBuckets = new Map(); // reused each frame — O(N) neighbour scan

function ptKey(x, y, z, tol) {
  return `${Math.round(x/tol)},${Math.round(y/tol)},${Math.round(z/tol)}`;
}

function loadTrafficJSON(modelPath) {
  removeCars();
  trafficData = null;
  adjacency = {};
  const jsonPath = modelPath.replace('.obj', '_traffic.json');
  fetch(jsonPath)
    .then(r => { if (!r.ok) throw new Error('no traffic json'); return r.json(); })
    .then(data => {
      trafficData = data;
      buildAdjacency(data);
      if (carsEnabled && currentObj) spawnCars();
    })
    .catch(() => {});
}

function buildAdjacency(data) {
  adjacency = {};
  const tol = data.street_width * 0.1;
  const segs = data.segments;
  for (let i = 0; i < segs.length; i++) {
    const seg = segs[i];
    const ss = seg.start, se = seg.end;
    const sk = ptKey(ss[0], ss[1], ss[2], tol);
    const ek = ptKey(se[0], se[1], se[2], tol);
    seg._sk = sk; seg._ek = ek;
    seg._len = Math.hypot(se[0]-ss[0], se[1]-ss[1], se[2]-ss[2]);
    const sw = data.street_width, len = seg._len || 1e-6;
    if (!adjacency[sk]) adjacency[sk] = [];
    if (!adjacency[ek]) adjacency[ek] = [];
    adjacency[sk].push({ segIdx: i, dir: 1 });
    adjacency[ek].push({ segIdx: i, dir: -1 });
  }
}

function nextSegment(curIdx, arrivedAtEnd) {
  const seg = trafficData.segments[curIdx];
  const key = arrivedAtEnd ? seg._ek : seg._sk;
  const opts = adjacency[key];
  if (!opts) return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };
  let count = 0;
  for (let i = 0; i < opts.length; i++) if (opts[i].segIdx !== curIdx) count++;
  if (!count) return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };
  let pick = Math.floor(Math.random() * count);
  for (let i = 0; i < opts.length; i++) {
    if (opts[i].segIdx !== curIdx && pick-- === 0) return opts[i];
  }
  return { segIdx: curIdx, dir: arrivedAtEnd ? -1 : 1 };
}

let carInstancedMesh = null;
const _carColor = new THREE.Color();

function spawnCars() {
  removeCars();
  if (!trafficData || !currentObj) return;
  const segs = trafficData.segments;
  if (!segs.length) return;

  const sw = trafficData.street_width;
  const carLen = sw * 1.2, carW = sw * 0.4, carH = sw * 0.5;
  const geo = new THREE.BoxGeometry(carW, carH, carLen);
  const mat = new THREE.MeshLambertMaterial();
  const count = parseInt(document.getElementById('car-count').value);

  carInstancedMesh = new THREE.InstancedMesh(geo, mat, count);
  carInstancedMesh.userData.isCar = true;
  carInstancedMesh.frustumCulled = false;
  carInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

  for (let i = 0; i < count; i++) {
    const segIdx = Math.floor(Math.random() * segs.length);
    const dir = Math.random() < 0.5 ? 1 : -1;
    const t = Math.random();
    _carColor.setHSL(Math.random(), 0.9, 0.55);
    carInstancedMesh.setColorAt(i, _carColor);
    const baseSpeed = CAR_SPEED * (0.85 + Math.random() * 0.3);
    carData.push({ idx: i, segIdx, dir, t, baseSpeed, currentSpeed: baseSpeed, lateralT: 0, _prevOncomingGap: Infinity });
  }
  if (carInstancedMesh.instanceColor) carInstancedMesh.instanceColor.needsUpdate = true;
  currentObj.add(carInstancedMesh);
  updateCars(0); // initial transform write — dt=0 so AI lerps are no-ops
}

function removeCars() {
  if (carInstancedMesh) {
    if (carInstancedMesh.parent) carInstancedMesh.parent.remove(carInstancedMesh);
    carInstancedMesh.geometry.dispose();
    carInstancedMesh.material.dispose();
    carInstancedMesh = null;
  }
  carData = [];
  _segBuckets.clear();
}

// Single-pass AI + transform write. Folds the old updateCars+updateCarPositions
// loops together so each car only does one segment lookup per frame.
function updateCars(dt) {
  if (!trafficData || !carInstancedMesh) return;
  const segs = trafficData.segments;
  const sw = trafficData.street_width;
  const followDist  = sw * FOLLOW_SW;
  const minGapDist  = sw * MIN_GAP_SW;
  const oncomingDist = sw * ONCOMING_SW;
  const clearDist   = sw * CLEAR_SW;
  // farthest distance at which any cross-segment neighbour still matters
  const maxScanDist = followDist > oncomingDist ? followDist : oncomingDist;
  const followRange = followDist - minGapDist;

  const surf = trafficData.surface || 'flat';
  const isFlat = surf === 'flat';
  const isSphere = surf === 'sphere' || surf === 'hemisphere';
  const lift = sw * 0.25;
  const laneOff = sw * 0.28;
  const lateralAmp = sw * 0.25;
  const torusMajor = isFlat || isSphere ? 0 : (trafficData.torus_major_sc || 0);
  const m = _carM4;
  const ela = m.elements;

  // bucket cars by segment (reuse arrays — no GC churn)
  for (const b of _segBuckets.values()) b.length = 0;
  for (let i = 0; i < carData.length; i++) {
    const car = carData[i];
    let b = _segBuckets.get(car.segIdx);
    if (!b) { b = []; _segBuckets.set(car.segIdx, b); }
    b.push(car);
  }

  for (let i = 0; i < carData.length; i++) {
    const car = carData[i];
    let seg = segs[car.segIdx];
    const isBlvd = seg.type === 'boulevard';
    const segLen = seg._len;

    let minFollowWorld   = Infinity;
    let minOncomingWorld = Infinity;

    // same-segment scan — skip if we're alone on this segment
    const bucket = _segBuckets.get(car.segIdx);
    if (bucket.length > 1) {
      const myFrac = car.dir === 1 ? car.t : 1 - car.t;
      for (let j = 0; j < bucket.length; j++) {
        const other = bucket[j];
        if (other === car) continue;
        if (other.dir === car.dir) {
          const gap = (other.t - car.t) * segLen;
          if (gap > 0 && gap < minFollowWorld) minFollowWorld = gap;
        } else if (!isBlvd) {
          const otFrac = other.dir === 1 ? other.t : 1 - other.t;
          const d = myFrac > otFrac ? myFrac - otFrac : otFrac - myFrac;
          const wg = d * segLen;
          if (wg < minOncomingWorld) minOncomingWorld = wg;
        }
      }
    }

    // cross-segment scan — only bother when we're close enough to the end
    // for a neighbour on the next segment to actually be in range.
    const myRemaining = (1 - car.t) * segLen;
    if (myRemaining < maxScanDist) {
      const frontKey = car.dir === 1 ? seg._ek : seg._sk;
      const adj = adjacency[frontKey];
      if (adj) {
        for (let k = 0; k < adj.length; k++) {
          const opt = adj[k];
          if (opt.segIdx === car.segIdx) continue;
          const nb = _segBuckets.get(opt.segIdx);
          if (!nb || !nb.length) continue;
          const nSeg = segs[opt.segIdx];
          const nSegLen = nSeg._len;
          const nIsBlvd = nSeg.type === 'boulevard';
          for (let j = 0; j < nb.length; j++) {
            const other = nb[j];
            if (other.dir === opt.dir) {
              const wg = myRemaining + other.t * nSegLen;
              if (wg < minFollowWorld) minFollowWorld = wg;
            } else if (!isBlvd && !nIsBlvd) {
              const wg = myRemaining + (1 - other.t) * nSegLen;
              if (wg < minOncomingWorld) minOncomingWorld = wg;
            }
          }
        }
      }
    }

    // speed: brake for car ahead, otherwise accelerate to baseSpeed
    const targetSpeed = minFollowWorld <= minGapDist ? 0
      : minFollowWorld < followDist ? car.baseSpeed * (minFollowWorld - minGapDist) / followRange
      : car.baseSpeed;
    const rate = targetSpeed < car.currentSpeed ? BRAKE_RATE : ACCEL_RATE;
    const sLerp = rate * dt; car.currentSpeed += (targetSpeed - car.currentSpeed) * (sLerp < 1 ? sLerp : 1);

    // lateral: shift right when an oncoming car is approaching (gap closing)
    const postPass = minOncomingWorld > car._prevOncomingGap;
    car._prevOncomingGap = minOncomingWorld;
    const clearThresh = postPass ? clearDist : oncomingDist;
    const lateralTarget = (!isBlvd && minOncomingWorld < clearThresh) ? 1 : 0;
    const lRate = lateralTarget > car.lateralT ? 2.5 : 3;
    const lLerp = lRate * dt; car.lateralT += (lateralTarget - car.lateralT) * (lLerp < 1 ? lLerp : 1);

    // advance along segment, hop to next segment if we ran off the end
    if (segLen > 0) car.t += (car.currentSpeed * dt) / segLen;
    if (car.t >= 1) {
      const next = nextSegment(car.segIdx, car.dir === 1);
      car.segIdx = next.segIdx; car.dir = next.dir; car.t = 0;
      seg = segs[car.segIdx];
    }

    // ── Render: write transform straight into the InstancedMesh buffer ──
    const s = car.dir === 1 ? seg.start : seg.end;
    const e = car.dir === 1 ? seg.end : seg.start;
    const ct = car.t;
    const x = s[0] + (e[0] - s[0]) * ct;
    const y = s[1] + (e[1] - s[1]) * ct;
    const z = s[2] + (e[2] - s[2]) * ct;
    const dx = e[0] - s[0], dy = e[1] - s[1], dz = e[2] - s[2];
    const lane = seg.type === 'boulevard' ? laneOff : car.lateralT * lateralAmp;

    if (!isFlat && (dx || dy || dz)) {
      if (isSphere) {
        _carNorm.set(x, y, z).normalize();
      } else {
        const xzl = Math.sqrt(x*x + z*z) || 1e-9;
        const k = torusMajor / xzl;
        _carNorm.set(x - x*k, y, z - z*k).normalize();
      }
      _carFwd.set(dx, dy, dz).normalize();
      _carRight.crossVectors(_carNorm, _carFwd).normalize();
      _carUp.crossVectors(_carFwd, _carRight);
      m.makeBasis(_carRight, _carUp, _carFwd);
      ela[12] = x + _carNorm.x * lift + _carRight.x * lane;
      ela[13] = y + _carNorm.y * lift + _carRight.y * lane;
      ela[14] = z + _carNorm.z * lift + _carRight.z * lane;
    } else {
      // flat: build rotation-Y matrix directly from (dx,dz) — no atan2/sin/cos
      const xzLen = Math.sqrt(dx*dx + dz*dz);
      const inv = xzLen > 0 ? 1 / xzLen : 0;
      const cs = dz * inv;  // cos(heading)
      const sn = dx * inv;  // sin(heading)
      ela[0] = cs;  ela[1] = 0; ela[2]  = -sn; ela[3]  = 0;
      ela[4] = 0;   ela[5] = 1; ela[6]  = 0;   ela[7]  = 0;
      ela[8] = sn;  ela[9] = 0; ela[10] = cs;  ela[11] = 0;
      ela[12] = x + lane * cs;
      ela[13] = y + lift;
      ela[14] = z - lane * sn;
      ela[15] = 1;
    }
    carInstancedMesh.setMatrixAt(car.idx, m);
  }
  carInstancedMesh.instanceMatrix.needsUpdate = true;
}

// ── OBJ Loader ────────────────────────────────────────────
const loader = new OBJLoader();

function loadModel(path) {
  status.textContent = `Loading ${path.split('/').pop()}…`;

  if (currentObj) {
    scene.remove(currentObj);
    currentObj.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
    currentObj = null;
  }
  removeRain();

  loader.load(path, (obj) => {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    autoScale = 80 / Math.max(size.x, size.y, size.z);
    modelCenter.copy(center);

    const merged = buildMergedFromObj(obj);
    obj.traverse(c => { if (c.isMesh) { c.geometry.dispose(); c.material.dispose(); } });
    merged.scale.setScalar(autoScale);
    merged.position.copy(modelCenter).multiplyScalar(-autoScale);

    scene.add(merged);
    currentObj = merged;
    applyWireframe();

    if (mode === 'rain') buildRain();
    loadTrafficJSON(path);

    status.textContent = `${path.split('/').pop()} — ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} units`;
  }, undefined, (err) => {
    status.textContent = `Error loading: ${path}`;
    console.error(err);
  });
}

function mergeMeshes(meshes, key) {
  if (!meshes.length) return null;
  const flatGeos = meshes.map(m => {
    m.updateMatrixWorld(true);
    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    g.applyMatrix4(m.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (k !== 'position') g.deleteAttribute(k);
    return g;
  });
  const merged = mergeGeometries(flatGeos);
  flatGeos.forEach(g => g.dispose());
  if (!merged) return null;
  merged.computeVertexNormals();
  const mesh = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ color: colorFor(key), side: THREE.DoubleSide }));
  mesh.userData.colorKey = key;
  return mesh;
}

function buildMergedFromObj(obj) {
  const groups = { base: [], road: [], building: [] };
  obj.traverse(c => { if (c.isMesh && !c.userData.isCar) groups[colorKey(c.name)].push(c); });
  const out = new THREE.Group();
  for (const key of ['base', 'road', 'building']) {
    const mesh = mergeMeshes(groups[key], key);
    if (mesh) out.add(mesh);
  }
  return out;
}

function updateColors() {
  if (!currentObj) return;
  currentObj.traverse(c => {
    if (!c.userData.colorKey || !c.material) return;
    c.material.color.copy(colorFor(c.userData.colorKey));
  });
}

// Wireframe via lazy-built EdgesGeometry + LineSegments.
// Way cheaper than `material.wireframe = true`:
//   - EdgesGeometry filters coplanar edges (cube → 12 lines, not 18+ triangle edges)
//   - LineBasicMaterial is unlit — no per-fragment lighting
//   - LineSegments uses gl.LINES directly, no triangle→line tessellation per draw
function applyWireframe() {
  if (!currentObj) return;
  const isWire = mode === 'wireframe';
  const opacity = parseFloat(document.getElementById('wire-opacity').value);
  const meshes = [];
  currentObj.traverse(c => { if (c.isMesh && c.userData.colorKey) meshes.push(c); });
  for (const mesh of meshes) {
    let lines = mesh.userData.wireLines;
    if (isWire && !lines) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 1);
      const lmat = new THREE.LineBasicMaterial({
        color: mesh.material.color.clone(),
        transparent: opacity < 1,
        opacity,
      });
      lines = new THREE.LineSegments(edges, lmat);
      lines.userData.colorKey = mesh.userData.colorKey;
      lines.position.copy(mesh.position);
      lines.quaternion.copy(mesh.quaternion);
      lines.scale.copy(mesh.scale);
      mesh.userData.wireLines = lines;
      mesh.parent.add(lines); // sibling, so hiding the mesh doesn't hide it
    }
    mesh.visible = !isWire;
    if (lines) {
      lines.visible = isWire;
      if (isWire) {
        lines.material.opacity = opacity;
        lines.material.transparent = opacity < 1;
      }
    }
  }
}


// ── Rain ──────────────────────────────────────────────────
function buildRain() {
  if (rainSystem) scene.remove(rainSystem);
  const count = 8000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 250;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainSystem = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.3, transparent: true, opacity: 0.6 }));
  scene.add(rainSystem);
}

function removeRain() {
  if (rainSystem) { scene.remove(rainSystem); rainSystem = null; }
}

function updateRain() {
  if (!rainSystem) return;
  const pos = rainSystem.geometry.attributes.position;
  const arr = pos.array;
  const n = pos.count * 3;
  for (let i = 1; i < n; i += 3) {
    arr[i] -= 0.8;
    if (arr[i] < -80) arr[i] = 120;
  }
  pos.needsUpdate = true;
}

// ── Animation loop ────────────────────────────────────────
let flyT = 0;

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();

  if (currentObj) {
    if (mode === 'daynight') {
      flyT += 0.008;
      const sunY = Math.sin(flyT);
      sun.position.set(Math.cos(flyT) * 200, sunY * 200, 60);
      const t = Math.max(0, sunY);
      const night = 1 - t;
      _bgColor.setRGB(night * 0.04, night * 0.04, night * 0.08 + t * 0.4);
      scene.background = _bgColor;
      ambient.intensity = 0.1 + t * 0.9;
      sun.color.setRGB(1, 0.6 + t * 0.4, 0.3 + t * 0.7);
    }

    if (mode === 'rain') {
      currentObj.rotation.y += rotSpeed * 0.3;
      updateRain();
    }
  }

  controls.update();

  if (carsEnabled) updateCars(dt);
  renderer.render(scene, camera);
});

// ── UI events ─────────────────────────────────────────────
document.querySelectorAll('#topbar [data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#topbar [data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;

    controls.autoRotate = (mode === 'orbit' || mode === 'wireframe');

    if (mode === 'rain') buildRain();
    else removeRain();

    if (mode === 'daynight') {
      flyT = 0;
    } else {
      scene.background = new THREE.Color(0x0a0a12);
      renderer.setClearColor(0x0a0a12);
      ambient.intensity = parseFloat(document.getElementById('ambient-slider').value);
      sun.color.set(0xfff4cc);
    }

    applyWireframe();
  });
});

document.getElementById('model-select').addEventListener('change', e => {
  loadModel(e.target.value);
});

document.getElementById('color-base').addEventListener('input', e => {
  baseColor.set(e.target.value);
  updateColors();
});

document.getElementById('color-pick').addEventListener('input', e => {
  modelColor.set(e.target.value);
  updateColors();
});

document.getElementById('color-road').addEventListener('input', e => {
  roadColor.set(e.target.value);
  updateColors();
});

function applyFog() {
  scene.fog = fogEnabled ? new THREE.FogExp2(0x0a0a12, fogDensity) : null;
}

document.getElementById('fog-toggle').addEventListener('change', e => {
  fogEnabled = e.target.checked;
  applyFog();
});

document.getElementById('fog-density').addEventListener('input', e => {
  fogDensity = parseFloat(e.target.value);
  if (fogEnabled) applyFog();
});


document.getElementById('speed-slider').addEventListener('input', e => {
  rotSpeed = parseFloat(e.target.value);
  controls.autoRotateSpeed = rotSpeed * 300;
});

document.getElementById('ambient-slider').addEventListener('input', e => {
  ambient.intensity = parseFloat(e.target.value);
});

document.getElementById('wire-opacity').addEventListener('input', () => {
  if (mode === 'wireframe') applyWireframe();
});


document.getElementById('btn-cars').addEventListener('click', () => {
  carsEnabled = !carsEnabled;
  document.getElementById('btn-cars').textContent = `Cars: ${carsEnabled ? 'ON' : 'OFF'}`;
  document.getElementById('btn-cars').classList.toggle('active', carsEnabled);
  if (carsEnabled) spawnCars();
  else removeCars();
});

document.getElementById('car-count').addEventListener('input', e => {
  document.getElementById('car-count-val').textContent = e.target.value;
  if (carsEnabled) spawnCars();
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Initial load ──────────────────────────────────────────
fetch('output/manifest.json')
  .then(r => r.json())
  .then(files => {
    const sel = document.getElementById('model-select');
    files.forEach(f => {
      const opt = document.createElement('option');
      opt.value = `output/${f}`;
      opt.textContent = f.replace('.obj', '');
      sel.appendChild(opt);
    });
    if (files.length) loadModel(`output/${files[0]}`);
  })
  .catch(() => { status.textContent = 'Error: could not load output/manifest.json'; });

// ── Music ─────────────────────────────────────────────────
const audio = new Audio();
audio.volume = 0.5;
let tracks = [];
let trackIdx = 0;

function playTrack(i) {
  if (!tracks.length) return;
  trackIdx = (i + tracks.length) % tracks.length;
  audio.src = `music/${tracks[trackIdx]}`;
  audio.play();
  document.getElementById('music-title').textContent = tracks[trackIdx].replace(/\.[^.]+$/, '');
  document.getElementById('music-play').textContent = '⏸';
}

audio.addEventListener('ended', () => playTrack(trackIdx + 1));

document.getElementById('music-play').addEventListener('click', () => {
  if (!tracks.length) return;
  if (audio.paused) {
    if (!audio.src || audio.src === window.location.href) playTrack(0);
    else audio.play();
    document.getElementById('music-play').textContent = '⏸';
  } else {
    audio.pause();
    document.getElementById('music-play').textContent = '▶';
  }
});

document.getElementById('music-prev').addEventListener('click', () => playTrack(trackIdx - 1));
document.getElementById('music-next').addEventListener('click', () => playTrack(trackIdx + 1));
document.getElementById('volume-slider').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });

fetch('music/manifest.json')
  .then(r => r.json())
  .then(files => {
    tracks = files;
    files.forEach(f => { const a = new Audio(`music/${f}`); a.preload = 'auto'; });
  });

// ── Generator ─────────────────────────────────────────────
let genWorker = null;
let lastObjText = null;

const genSliders = [
  ['gen-width',   'gen-width-val'],
  ['gen-depth',   'gen-depth-val'],
  ['gen-block',   'gen-block-val'],
  ['gen-street',  'gen-street-val'],
  ['gen-floors',  'gen-floors-val'],
  ['gen-hw',      'gen-hw-val'],
  ['gen-vsites',  'gen-vsites-val'],
  ['gen-sradius', 'gen-sradius-val'],
  ['gen-tmajor',  'gen-tmajor-val'],
  ['gen-tminor',  'gen-tminor-val'],
];
genSliders.forEach(([id, valId]) => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById(valId).textContent = e.target.value;
  });
});

document.getElementById('gen-voronoi').addEventListener('change', e => {
  document.getElementById('gen-vsites-row').style.display = e.target.checked ? 'block' : 'none';
});

document.getElementById('gen-surface').addEventListener('change', e => {
  const s = e.target.value;
  document.getElementById('gen-sphere-row').style.display     = (s === 'sphere' || s === 'hemisphere') ? 'block' : 'none';
  document.getElementById('gen-torus-major-row').style.display = s === 'torus' ? 'block' : 'none';
  document.getElementById('gen-torus-minor-row').style.display = s === 'torus' ? 'block' : 'none';
});

document.getElementById('btn-generate').addEventListener('click', () => {
  if (genWorker) genWorker.terminate();
  genWorker = new Worker('./generator.js?v=' + Date.now(), { type: 'module' });

  const btn = document.getElementById('btn-generate');
  const genStatus = document.getElementById('gen-status');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  genStatus.textContent = 'Building city…';
  document.getElementById('btn-download').style.display = 'none';

  const config = {
    seed:              parseInt(document.getElementById('gen-seed').value),
    city_width:        parseInt(document.getElementById('gen-width').value),
    city_depth:        parseInt(document.getElementById('gen-depth').value),
    block_width:       parseInt(document.getElementById('gen-block').value),
    block_depth:       parseInt(document.getElementById('gen-block').value),
    street_width:      parseInt(document.getElementById('gen-street').value),
    max_floors:        parseInt(document.getElementById('gen-floors').value),
    dist:              document.getElementById('gen-dist').value,
    num_highways:      parseInt(document.getElementById('gen-hw').value),
    voronoi_boulevards:document.getElementById('gen-voronoi').checked,
    voronoi_sites:     parseInt(document.getElementById('gen-vsites').value),
    diagonal_road:     document.getElementById('gen-diagonal').checked,

    window_min_floors: document.getElementById('gen-windows').checked ? 4 : 999,
    add_base:          document.getElementById('gen-base').checked,
    surface:           document.getElementById('gen-surface').value,
    sphere_radius:     parseInt(document.getElementById('gen-sradius').value),
    torus_major:       parseInt(document.getElementById('gen-tmajor').value),
    torus_minor:       parseInt(document.getElementById('gen-tminor').value),
  };

  genWorker.onmessage = e => {
    btn.disabled = false;
    btn.textContent = 'Generate';
    if (!e.data.ok) {
      genStatus.textContent = 'Error: ' + e.data.error;
      console.error(e.data.error);
      return;
    }

    const { objects, surface: genSurface, traffic } = e.data;
    genStatus.textContent = `${genSurface ?? 'flat'} — ${objects.length} objects`;

    // Build Three.js group from typed arrays
    if (currentObj) {
      removeCars();
      scene.remove(currentObj);
      currentObj.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
    }

    // Group raw geometry by color category — collapses hundreds of meshes to 3 draw calls
    const groupBuf = { base: { totalIdx: 0, parts: [] }, road: { totalIdx: 0, parts: [] }, building: { totalIdx: 0, parts: [] } };
    for (const { name, verts, faces } of objects) {
      const k = colorKey(name);
      groupBuf[k].parts.push({ verts, faces });
      groupBuf[k].totalIdx += faces.length;
    }

    const group = new THREE.Group();
    for (const key of ['base', 'road', 'building']) {
      const g = groupBuf[key];
      if (!g.totalIdx) continue;
      const positions = new Float32Array(g.totalIdx * 3);
      let off = 0;
      for (const { verts, faces } of g.parts) {
        for (let i = 0; i < faces.length; i++) {
          const idx = faces[i] * 3;
          positions[off++] = verts[idx];
          positions[off++] = verts[idx + 1];
          positions[off++] = verts[idx + 2];
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: colorFor(key), side: THREE.DoubleSide }));
      mesh.userData.colorKey = key;
      group.add(mesh);
    }

    // Auto-centre and scale
    const box3 = new THREE.Box3().setFromObject(group);
    const size3 = box3.getSize(new THREE.Vector3());
    const center3 = box3.getCenter(new THREE.Vector3());
    autoScale = 80 / Math.max(size3.x, size3.y, size3.z);
    modelCenter.copy(center3);
    group.scale.setScalar(autoScale);
    group.position.copy(center3).multiplyScalar(-autoScale);

    scene.add(group);
    currentObj = group;
    applyWireframe();
    trafficData = null; adjacency = {};
    buildAdjacency(traffic); trafficData = traffic;
    if (carsEnabled) spawnCars();
    status.textContent = `Generated — ${objects.length} objects`;

    // Build OBJ for download
    lastObjText = buildObjText(objects, config.seed);
    document.getElementById('btn-download').style.display = 'block';
  };

  genWorker.postMessage(config);
});

document.getElementById('btn-download').addEventListener('click', () => {
  if (!lastObjText) return;
  const blob = new Blob([lastObjText], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `city_seed${document.getElementById('gen-seed').value}.obj`;
  a.click();
  URL.revokeObjectURL(a.href);
});

function buildObjText(objects, seed) {
  const lines = [`# Generated by procity (seed ${seed})`];
  let offset = 1;
  for (const { name, verts, faces } of objects) {
    lines.push(`o ${name}`);
    for (let i = 0; i < verts.length; i += 3)
      lines.push(`v ${verts[i].toFixed(6)} ${verts[i+1].toFixed(6)} ${verts[i+2].toFixed(6)}`);
    for (let i = 0; i < faces.length; i += 3)
      lines.push(`f ${faces[i]+offset} ${faces[i+1]+offset} ${faces[i+2]+offset}`);
    offset += verts.length / 3;
  }
  return lines.join('\n');
}
